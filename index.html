    window.placeAuctionBid = async function() {
      const user = getCurrentUser();
      const auc = state.config.auction;
      if (!user || !auc || auc.closed || !auc.active || auc.settled) return;

      const amount = parseInt(document.getElementById('auctionBidInput').value, 10);
      if (!amount || amount < 100) return showToast('Minimal tawaran lelang adalah 100 Diamond!', 'error');

      auc.bids = auc.bids || [];
      const existing = auc.bids.find((b) => b.email === user.email);
      const prevBid = existing ? existing.amount : 0;

      if (amount <= prevBid) return showToast(`Tawaran baru harus lebih besar dari tawaranmu sebelumnya (${prevBid} DM)!`, 'error');
      const diff = amount - prevBid;
      if (user.diamond < diff) return showToast('Diamond tidak cukup untuk menaikkan tawaran!', 'error');

      user.diamond -= diff;
      if (existing) {
        existing.amount = amount;
        existing.username = user.username;
      } else {
        auc.bids.push({ email: user.email, id: user.id, username: user.username, amount });
      }

      await saveUser(user);
      await saveConfig();
      showToast(`Tawaran ${amount.toLocaleString('id-ID')} Diamond berhasil dipasang!`, 'success');
      scheduleRender();
    };

    window.toggleFriendStickerDrawer = function() {
      friendStickerDrawerOpen = !friendStickerDrawerOpen;

    window.sendFriendSticker = async function(friendId, stickerId) {
      const user = getCurrentUser();
      const friend = Object.values(state.users).find((u) => u.id === friendId);
      if (!user || !friend) return;

      const msgObj = {
        id: 'fmsg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        from: user.username,
        type: 'sticker',
        stickerId,
        text: '[Stiker]',
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      };

      user.chats = user.chats || {};
      user.chats[friend.id] = user.chats[friend.id] || [];
      user.chats[friend.id].push(msgObj);

      friend.chats = friend.chats || {};
      friend.chats[user.id] = friend.chats[user.id] || [];
      friend.chats[user.id].push(msgObj);

      friendStickerDrawerOpen = false;
      await saveUser(user);
      await saveUser(friend);
      renderFullscreenFriendChat();
    };

    window.openFriendChatModal = function(friendId) {
      activeChatFriendId = friendId;
      friendStickerDrawerOpen = false;
      renderFullscreenFriendChat();
    };

    window.closeFriendChatModal = function() {
      activeChatFriendId = null;
      friendStickerDrawerOpen = false;
      closeFullscreenOverlay();
      scheduleRender();
    };

    window.sendFriendChat = async function(friendId) {
      const user = getCurrentUser();
      const friend = Object.values(state.users).find((u) => u.id === friendId);
      const inp = document.getElementById('friendChatInput');
      if (!inp) return;
      const text = inp.value.trim();
      if (!user || !friend || !text) return;

      const msgObj = {
        id: 'fmsg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        from: user.username,
        type: 'text',
        text,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      };

      user.chats = user.chats || {};
      user.chats[friend.id] = user.chats[friend.id] || [];
      user.chats[friend.id].push(msgObj);

      friend.chats = friend.chats || {};
      friend.chats[user.id] = friend.chats[user.id] || [];
      friend.chats[user.id].push(msgObj);

      await saveUser(user);
      await saveUser(friend);
      renderFullscreenFriendChat();
    };

    window.deleteFriendChatMessage = async function(friendId, messageId) {
      const user = getCurrentUser();
      const friend = Object.values(state.users).find((u) => u.id === friendId);
      if (!user || !friend || !messageId) return;
      const mine = (user.chats || {})[friend.id] || [];
      const message = mine.find((m) => m.id === messageId);
      if (!message || message.from !== user.username) return showToast('Pesan ini tidak dapat dihapus.', 'error');
      if (!window.confirm('Hapus pesan yang salah ketik ini?')) return;
      user.chats[friend.id] = mine.filter((m) => m.id !== messageId);
      friend.chats = friend.chats || {};
      friend.chats[user.id] = (friend.chats[user.id] || []).filter((m) => m.id !== messageId);
      await saveUser(user);
      await saveUser(friend);
      showToast('Pesan berhasil dihapus.', 'success');
      renderFullscreenFriendChat();
    };

    function generateGroupInviteCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = 'WOP-GRP-';
      for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    window.handleCreateGroup = async function() {
      const user = getCurrentUser();
      if (!user) return;
      const name = document.getElementById('newGroupName').value.trim();
      const desc = document.getElementById('newGroupDesc').value.trim() || 'Grup Mabar Resmi WAR OF POWER';
      const fileInp = document.getElementById('newGroupAvatarFile');

      if (!name) return showToast('Nama grup wajib diisi!', 'error');

      const finishCreate = async (avatarData) => {
        const grp = {
          id: 'grp_' + Date.now(),
          name: name.toUpperCase(),
          desc,
          avatar: avatarData,
          inviteCode: generateGroupInviteCode(),
          creatorEmail: user.email,
          admins: [user.email],
          members: [user.email],
          kickedMembers: [],
          createdAt: new Date().toLocaleString('id-ID'),
          messages: [
            {
              id: 'gmsg_' + Date.now(),
              type: 'system',
              senderName: 'SYSTEM',
              text: `${user.username} membuat grup "${name.toUpperCase()}".`,
              time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            }
          ]
        };
        state.config.groups = state.config.groups || [];
        state.config.groups.unshift(grp);
        await saveConfig();
        closeModal();
        activeGroupId = grp.id;
        groupSubView = 'chat';
        groupSilentMonitorMode = false;
        showToast(`Grup "${grp.name}" berhasil dibuat!`, 'success');
        scheduleRender();
      };

      if (fileInp && fileInp.files && fileInp.files[0]) {
        compressImageFile(fileInp.files[0], (dataUrl) => finishCreate(dataUrl), 180);
      } else {
        finishCreate(makeSvgBadge(name.slice(0, 4).toUpperCase(), '#059669', '#0f172a', '🛡️'));
      }
    };

    window.handleJoinGroupByCode = async function() {
      const user = getCurrentUser();
      if (!user) return;
      const raw = document.getElementById('joinGroupCodeInput').value.trim().toUpperCase();
      if (!raw) return showToast('Masukkan kode atau link grup!', 'error');

      const matchCode = raw.match(/WOP-GRP-[A-Z0-9]+/) ? raw.match(/WOP-GRP-[A-Z0-9]+/)[0] : raw;
      const grp = (state.config.groups || []).find((g) => g.inviteCode.toUpperCase() === matchCode);
      if (!grp) return showToast('Kode atau Link Grup tidak ditemukan!', 'error');

      if ((grp.kickedMembers || []).includes(user.email)) {
        return showToast('Kamu telah dikeluarkan (Kick) dari grup ini dan tidak dapat bergabung kembali!', 'error');
      }
      if ((grp.members || []).includes(user.email)) {
        closeModal();
        activeGroupId = grp.id;
        groupSubView = 'chat';
        groupSilentMonitorMode = false;
        scheduleRender();
        return;
      }

      grp.members.push(user.email);
      grp.messages.push({
        id: 'gmsg_' + Date.now(),
        type: 'system',
        senderName: 'SYSTEM',
        text: `${user.username} (${user.id}) bergabung melalui Link Undangan Grup.`,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      });
      await saveConfig();
      closeModal();
      activeGroupId = grp.id;
      groupSubView = 'chat';
      groupSilentMonitorMode = false;
      showToast(`Berhasil bergabung ke grup ${grp.name}!`, 'success');
      scheduleRender();
    };

                    <button onclick="invitePlayerToGroup('${grp.id}')" class="px-3 py-2 rounded-xl bg-emerald-400 text-slate-950 font-gaming font-black text-[10px]">+ UNDANG</button>
                  </div>
                </div>
              ` : ''}

              <div class="glass-card rounded-2xl p-3.5 border border-slate-800 space-y-2">
                <div class="font-gaming font-bold text-xs text-cyan-300">👥 DAFTAR ANGGOTA GRUP (${(grp.members || []).length})</div>
                ${(grp.members || []).map((mEmail) => {
                  const m = state.users[mEmail];
                  if (!m) return '';
                  const isCreator = grp.creatorEmail === mEmail;
                  const isAdminMember = (grp.admins || []).includes(mEmail);
                  const mOnline = isUserCurrentlyOnline(m);
                  return `
                    <div class="flex items-center justify-between p-2 rounded-xl bg-slate-950 border border-slate-800 gap-2">
                      <div class="flex items-center gap-2 min-w-0">
                        <div class="relative shrink-0">
                          <img src="${m.avatar}" class="w-8 h-8 rounded-lg object-cover" />
                          <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full ${mOnline ? 'bg-emerald-400' : 'bg-rose-500'}"></span>
                        </div>
                        <div class="min-w-0">
                          <div class="flex items-center gap-1 flex-wrap">
                            <span class="text-xs font-bold text-white truncate">${escapeHTML(m.username)}</span>
                            ${isCreator ? `<span class="px-1.5 py-0.2 rounded bg-amber-400 text-slate-950 font-gaming font-black text-[8px]">PEMBUAT</span>` : isAdminMember ? `<span class="px-1.5 py-0.2 rounded bg-cyan-500/20 text-cyan-300 font-gaming text-[8px]">ADMIN</span>` : ''}
                          </div>
                          <div class="text-[9px] text-slate-400 font-mono">${m.id}</div>
                        </div>
                      </div>
                      ${isGroupAdmin && !isCreator && mEmail !== user.email ? `
                        <div class="flex items-center gap-1 shrink-0">
                          <button onclick="toggleGroupMemberAdmin('${grp.id}', '${mEmail}')" class="px-2 py-1 rounded bg-cyan-500/20 border border-cyan-400/50 text-cyan-300 text-[9px] font-bold">
                            ${isAdminMember ? 'Cabut Admin' : 'Jadikan Admin'}
                          </button>
                          <button onclick="kickGroupMember('${grp.id}', '${mEmail}')" class="px-2 py-1 rounded bg-rose-600 text-white text-[9px] font-gaming font-bold">
                            KICK
                          </button>
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>

              ${!isSilentMonitor ? `
                <button onclick="exitFromGroup('${grp.id}')" class="w-full py-2.5 rounded-xl bg-rose-950 border border-rose-500/50 text-rose-300 font-gaming font-bold text-xs">
                  🚪 KELUAR DARI GRUP
                </button>
              ` : ''}
            </div>
          ` : `
            <div id="groupChatFeed" class="flex-1 overflow-y-auto p-3 space-y-2.5 bg-[#050811]">
              ${(grp.messages || []).map((msg) => {
                if (msg.type === 'system') {
                  return `
                    <div class="text-center">
                      <span class="inline-block px-3 py-1 rounded-full bg-slate-900/90 border border-slate-800 text-[10px] text-amber-200 font-semibold">
                        ${escapeHTML(msg.text)}
                      </span>
                    </div>
                  `;
                }
                const isMine = msg.senderEmail === user.email;
                const senderObj = state.users[msg.senderEmail];
                return `
                  <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[82%] rounded-2xl p-2.5 ${msg.type === 'sticker' ? 'bg-transparent p-0' : isMine ? 'bg-emerald-950/90 border border-emerald-500/40 rounded-tr-none' : 'bg-slate-900/95 border border-slate-800 rounded-tl-none'}">
                      ${!isMine ? `
                        <div class="flex items-center gap-1 mb-1">
                          <span class="text-[10px] font-gaming font-bold text-cyan-300">${escapeHTML(msg.senderName)}</span>
                          ${senderObj ? renderBadgesHTML(senderObj) : ''}
                        </div>
                      ` : ''}

                      ${msg.type === 'sticker' ? `
                        <div class="my-0.5">${renderStickerGraphicHTML(msg.stickerId, 'w-24 h-24')}</div>
                      ` : msg.type === 'poll' ? `
                        <div class="space-y-2 min-w-[210px]">
                          <div class="text-[10px] font-gaming font-bold text-amber-300">📊 POLLING GRUP</div>
                          <div class="text-xs font-bold text-white">${escapeHTML(msg.question)}</div>
                          <div class="space-y-1.5">
                            ${(msg.options || []).map((opt, oIdx) => {
                              const votes = opt.voters || [];
                              const totalVotes = (msg.options || []).reduce((s, o) => s + (o.voters || []).length, 0);
                              const pct = totalVotes > 0 ? Math.round((votes.length / totalVotes) * 100) : 0;
                              const votedMe = votes.includes(user.email);
                              return `
                                <button ${isSilentMonitor ? 'disabled' : ''} onclick="voteInGroupPoll('${grp.id}', '${msg.id}', ${oIdx})" class="w-full text-left p-2 rounded-xl border transition relative overflow-hidden ${votedMe ? 'border-emerald-400 bg-emerald-500/15' : 'border-slate-700 bg-slate-950'}">
                                  <div class="flex justify-between text-[11px] font-bold relative z-10">
                                    <span class="text-white">${votedMe ? '✅ ' : ''}${escapeHTML(opt.label)}</span>
                                    <span class="text-cyan-300">${votes.length} (${pct}%)</span>
                                  </div>
                                  <div class="w-full h-1.5 bg-slate-800 rounded-full mt-1 overflow-hidden">
                                    <div class="h-full bg-emerald-400" style="width:${pct}%"></div>
                                  </div>
                                </button>
                              `;
                            }).join('')}
                          </div>
                        </div>
                      ` : `
                        <div class="text-xs text-slate-100 leading-relaxed break-words">${escapeHTML(msg.text)}</div>
                      `}

                      <div class="flex items-center justify-end gap-2 mt-1">
                        <span class="text-[9px] text-slate-400">${msg.time}</span>
                        ${(isGroupAdmin || isMine) && !isSilentMonitor ? `
                          <button onclick="deleteGroupMessage('${grp.id}', '${msg.id}')" class="text-[9px] text-rose-400 hover:underline">Hapus</button>

              }).join('')}

            ${!isSilentMonitor ? `
              ${groupStickerDrawerOpen ? `
                <div class="p-2.5 bg-slate-950 border-t border-slate-800 shrink-0">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[10px] font-gaming font-bold text-amber-300">🎭 PILIH STIKER GRUP (24 STIKER)</span>
                    <button onclick="toggleGroupStickerDrawer()" class="text-[10px] text-slate-400 font-bold">Tutup ✕</button>
                  </div>
                  <div class="grid grid-cols-4 sm:grid-cols-6 gap-2 max-h-44 overflow-y-auto pr-1">
                    ${GROUP_STICKERS.map((s) => `
                      <button onclick="sendGroupSticker('${grp.id}', '${s.id}')" class="flex flex-col items-center p-1 rounded-xl hover:bg-slate-900 active:scale-95 transition">
                        ${renderStickerGraphicHTML(s.id, 'w-14 h-14')}
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <div class="p-2.5 bg-slate-950 border-t border-emerald-500/30 flex items-center gap-1.5 shrink-0">
                <button onclick="toggleGroupStickerDrawer()" class="p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-amber-300 text-sm shrink-0" title="Kirim Stiker">🎭</button>
                <button onclick="openCreateGroupPollModal('${grp.id}')" class="p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-cyan-300 text-sm shrink-0" title="Buat Polling">📊</button>
                <input id="groupChatTextInput" onkeydown="if(event.key==='Enter') sendGroupTextMessage('${grp.id}')" type="text" placeholder="Ketik pesan grup..." class="flex-1 px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white focus:border-emerald-400 outline-none" />
                <button onclick="sendGroupTextMessage('${grp.id}')" class="px-3.5 py-2.5 rounded-xl bg-emerald-400 text-slate-950 font-gaming font-black text-xs shrink-0">KIRIM</button>
              </div>
            ` : `
              <div class="p-2.5 bg-amber-500/15 border-t border-amber-400/40 text-center text-[11px] font-bold text-amber-300 shrink-0">
                👁️ MODE PEMANTAUAN STAFF (Hanya membaca aktivitas chat grup secara diam-diam)
              </div>
            `}
          `}
        </div>
      `;
    }

    async function enforceGroupProfanityFilter(user, grp, rawText) {
      if (isProtectedOwnerAccount(user)) return false;
      const detectedWord = detectProfanity(rawText);
      if (!detectedWord) return false;

      const modCfg = state.config.groupModeration || { maxViolations: 3, autoAction: 'kick' };
      const maxViol = Number(modCfg.maxViolations || 3);

      state.config.groupViolations = state.config.groupViolations || [];
      let record = state.config.groupViolations.find((v) => v.userEmail === user.email && v.groupId === grp.id);
      if (!record) {
        record = {
          id: 'viol_' + Date.now(),
          userEmail: user.email,
          userId: user.id,
          username: user.username,
          groupId: grp.id,
          groupName: grp.name,
          count: 0,
          lastWord: detectedWord,
          lastTime: ''
        };
        state.config.groupViolations.unshift(record);
      }
      record.count += 1;
      record.lastWord = detectedWord;
      record.lastTime = new Date().toLocaleString('id-ID');

      grp.messages.push({
        id: 'sys_warn_' + Date.now(),
        type: 'system',
        senderName: 'AI MODERATOR',
        text: `⚠️ PERINGATAN AI MODERATOR: ${user.username} terdeteksi mengucapkan kata kasar/terlarang! (Pelanggaran ${record.count}/${maxViol})`,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      });

      if (record.count >= maxViol) {
        grp.members = (grp.members || []).filter((em) => em !== user.email);
        grp.admins = (grp.admins || []).filter((em) => em !== user.email);
        grp.kickedMembers = grp.kickedMembers || [];
        if (!grp.kickedMembers.includes(user.email)) grp.kickedMembers.push(user.email);

        grp.messages.push({
          id: 'sys_kick_' + Date.now(),
          type: 'system',
          senderName: 'AI MODERATOR',
          text: `🚫 ${user.username} otomatis DI-KICK dari grup karena mencapai batas ${maxViol}× pelanggaran kata kasar!`,
          time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        });

        if (modCfg.autoAction === 'ban' && !user.badges?.admin) {
          user.banned = true;
          await saveUser(user);
        }

        await saveConfig();
        activeGroupId = null;
        closeFullscreenOverlay();
        showToast(`Kamu dikeluarkan dari grup karena melanggar batas ${maxViol}× kata terlarang!`, 'error');
        scheduleRender();
        return true;
      }

      await saveConfig();
      showToast(`⚠️ Peringatan Kata Kasar (${record.count}/${maxViol})! Jangan berkata kasar/18+ di grup!`, 'error');
      scheduleRender();
      return true;
    }

    window.sendGroupTextMessage = async function(groupId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      const inp = document.getElementById('groupChatTextInput');
      if (!user || !grp || !inp) return;
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';

      const blocked = await enforceGroupProfanityFilter(user, grp, text);
      if (blocked) return;

      grp.messages.push({
        id: 'gm_' + Date.now(),
        type: 'text',
        senderEmail: user.email,
        senderName: user.username,
        text,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      });
      await saveConfig();
      scheduleRender();
    };

    window.sendGroupSticker = async function(groupId, stickerId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;

      grp.messages.push({
        id: 'gstk_' + Date.now(),
        type: 'sticker',
        senderEmail: user.email,
        senderName: user.username,
        stickerId,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      });
      groupStickerDrawerOpen = false;
      await saveConfig();
      scheduleRender();
    };

    window.openCreateGroupPollModal = function(groupId) {
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <h3 class="font-gaming font-black text-xs text-cyan-300">📊 BUAT POLLING GRUP</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white font-bold">✕</button>
          </div>
          <input id="pollQuestionInp" type="text" placeholder="Pertanyaan polling (misal: Mabar jam berapa?)..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
          <input id="pollOpt1Inp" type="text" placeholder="Pilihan 1..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
          <input id="pollOpt2Inp" type="text" placeholder="Pilihan 2..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
          <input id="pollOpt3Inp" type="text" placeholder="Pilihan 3 (opsional)..." class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white" />
          <button onclick="submitGroupPoll('${groupId}')" class="w-full py-2.5 rounded-xl bg-cyan-400 text-slate-950 font-gaming font-black text-xs">KIRIM POLLING KE GRUP</button>
        </div>
      `);
    };

    window.submitGroupPoll = async function(groupId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;
      const q = document.getElementById('pollQuestionInp').value.trim();
      const o1 = document.getElementById('pollOpt1Inp').value.trim();
      const o2 = document.getElementById('pollOpt2Inp').value.trim();
      const o3 = document.getElementById('pollOpt3Inp').value.trim();

      if (!q || !o1 || !o2) return showToast('Pertanyaan dan minimal 2 pilihan wajib diisi!', 'error');
      const combined = `${q} ${o1} ${o2} ${o3}`;
      if (detectProfanity(combined)) return showToast('Polling mengandung kata terlarang!', 'error');

      const options = [{ label: o1, voters: [] }, { label: o2, voters: [] }];
      if (o3) options.push({ label: o3, voters: [] });

      grp.messages.push({
        id: 'gpoll_' + Date.now(),
        type: 'poll',
        senderEmail: user.email,
        senderName: user.username,
        question: q,
        options,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      });
      await saveConfig();
      closeModal();
      scheduleRender();
    };

    window.voteInGroupPoll = async function(groupId, msgId, optIdx) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;
      const msg = (grp.messages || []).find((m) => m.id === msgId);
      if (!msg || !msg.options) return;

      msg.options.forEach((opt) => {
        opt.voters = (opt.voters || []).filter((em) => em !== user.email);
      });
      msg.options[optIdx].voters.push(user.email);
      await saveConfig();
      scheduleRender();
    };

    window.deleteGroupMessage = async function(groupId, msgId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;
      const msg = (grp.messages || []).find((m) => m.id === msgId);
      const canDelete = msg && (msg.senderEmail === user.email ||
        (grp.creatorEmail === user.email) || (grp.admins || []).includes(user.email));
      if (!canDelete) return showToast('Kamu hanya dapat menghapus pesan sendiri.', 'error');
      if (!window.confirm('Hapus pesan ini?')) return;
      grp.messages = (grp.messages || []).filter((m) => m.id !== msgId);
      await saveConfig();
      showToast('Pesan berhasil dihapus.', 'success');
      scheduleRender();
    };

    window.saveGroupProfileEdit = async function(groupId) {
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!grp) return;
      const newName = document.getElementById('editGroupNameInp').value.trim();
      const newDesc = document.getElementById('editGroupDescInp').value.trim();
      if (newName) grp.name = newName.toUpperCase();
      grp.desc = newDesc;
      await saveConfig();
      showToast('Profil grup diperbarui!', 'success');
      scheduleRender();
    };

    window.changeGroupAvatarFile = function(ev, groupId) {
      const file = ev.target.files[0];
      if (!file) return;
      compressImageFile(file, async (dataUrl) => {
        const grp = (state.config.groups || []).find((g) => g.id === groupId);
        if (!grp) return;
        grp.avatar = dataUrl;
        await saveConfig();
        showToast('Foto profil grup berhasil diganti!', 'success');
        scheduleRender();
      }, 180);
    };

    window.invitePlayerToGroup = async function(groupId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      const q = document.getElementById('inviteMemberToGroupInp').value.trim();
      const target = findUserByQuery(q);
      if (!grp || !target) return showToast('Pemain tidak ditemukan!', 'error');
      if ((grp.members || []).includes(target.email)) return showToast('Pemain sudah ada di dalam grup!', 'info');

      grp.kickedMembers = (grp.kickedMembers || []).filter((em) => em !== target.email);
      grp.members.push(target.email);
      grp.messages.push({
        id: 'ginv_' + Date.now(),
        type: 'system',
        senderName: 'SYSTEM',
        text: `${user.username} mengundang ${target.username} (${target.id}) ke dalam grup.`,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      });
      await saveConfig();
      showToast(`${target.username} berhasil ditambahkan ke grup!`, 'success');
      scheduleRender();
    };

    window.toggleGroupMemberAdmin = async function(groupId, memberEmail) {
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!grp) return;
      grp.admins = grp.admins || [];
      if (grp.admins.includes(memberEmail)) {
        grp.admins = grp.admins.filter((em) => em !== memberEmail);
      } else {
        grp.admins.push(memberEmail);
      }
      await saveConfig();
      scheduleRender();
    };

    window.kickGroupMember = async function(groupId, memberEmail) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      const target = state.users[memberEmail];
      if (!grp || !target || grp.creatorEmail === memberEmail) return;

      grp.members = (grp.members || []).filter((em) => em !== memberEmail);
      grp.admins = (grp.admins || []).filter((em) => em !== memberEmail);
      grp.kickedMembers = grp.kickedMembers || [];
      if (!grp.kickedMembers.includes(memberEmail)) grp.kickedMembers.push(memberEmail);

      grp.messages.push({
        id: 'gkick_' + Date.now(),
        type: 'system',
        senderName: 'ADMIN GRUP',
        text: `🚫 ${target.username} telah dikeluarkan (Kick) dari grup oleh ${user.username}.`,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      });
      await saveConfig();
      showToast(`${target.username} dikeluarkan dari grup!`, 'info');
      scheduleRender();
    };

    window.exitFromGroup = async function(groupId) {
      const user = getCurrentUser();
      const grp = (state.config.groups || []).find((g) => g.id === groupId);
      if (!user || !grp) return;

      grp.members = (grp.members || []).filter((em) => em !== user.email);
      grp.admins = (grp.admins || []).filter((em) => em !== user.email);
      grp.messages.push({
        id: 'gexit_' + Date.now(),
        type: 'system',
        senderName: 'SYSTEM',
        text: `${user.username} keluar dari grup.`,
        time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
      });

      if (grp.members.length === 0) {
        state.config.groups = (state.config.groups || []).filter((g) => g.id !== groupId);
      }
      await saveConfig();
      activeGroupId = null;
      closeFullscreenOverlay();
      showToast('Kamu telah keluar dari grup.', 'info');
      scheduleRender();
    };

    window.likePlayerById = async function(targetId) {
      const user = getCurrentUser();
      const target = findUserByQuery(targetId);
      if (!user || !target) return;
      target.likedBy = target.likedBy || [];
      if (target.likedBy.includes(user.email)) {
        target.likedBy = target.likedBy.filter((email) => email !== user.email);
        target.likes = Math.max(0, Number(target.likes || 0) - 1);
        await saveUser(target);
        showToast(`Like dari ${target.username} dibatalkan.`, 'info');
      } else {
        target.likedBy.push(user.email);
        target.likes = (target.likes || 0) + 1;
        await saveUser(target);
        playBeep(760, 0.08);
        showToast(`❤️ Kamu menyukai ${target.username} (${target.id})!`, 'success');
      }
      if (activeChatFriendId === target.id) {
        renderFullscreenFriendChat();
      } else {
        scheduleRender();
      }
    };

    window.sendFriendRequest = async function(targetEmail) {
      const user = getCurrentUser();
      const target = state.users[targetEmail];
      if (!user || !target) return;
      target.friendRequests = target.friendRequests || [];
      if (target.friendRequests.includes(user.email)) return showToast('Permintaan pertemanan sudah terkirim!', 'info');
      target.friendRequests.push(user.email);
      await saveUser(target);

      const sender = state.users[senderEmail];
      if (!user || !sender) return;
      user.friendRequests = (user.friendRequests || []).filter((e) => e !== senderEmail);
      user.friends = user.friends || [];
      sender.friends = sender.friends || [];
      if (!user.friends.includes(senderEmail)) user.friends.push(senderEmail);
      if (!sender.friends.includes(user.email)) sender.friends.push(user.email);
      await saveUser(user);
      await saveUser(sender);
      showToast(`Sekarang kamu berteman dengan ${sender.username}!`, 'success');
      scheduleRender();
    };

    window.rejectFriendRequest = async function(senderEmail) {
      const user = getCurrentUser();
      if (!user) return;
      user.friendRequests = (user.friendRequests || []).filter((e) => e !== senderEmail);

      scheduleRender();

    window.toggleMessageSelectMode = function() {
      messageSelectMode = !messageSelectMode;
      selectedMessageIds.clear();
      scheduleRender();
    };

    window.toggleSingleMessageSelect = function(msgId) {
      if (selectedMessageIds.has(msgId)) selectedMessageIds.delete(msgId);
      else selectedMessageIds.add(msgId);
      scheduleRender();
    };

    window.toggleSelectAllMessages = function() {
      const user = getCurrentUser();
      if (!user) return;
      const msgs = user.messages || [];
      if (selectedMessageIds.size === msgs.length) {
        selectedMessageIds.clear();
      } else {
        msgs.forEach((m) => selectedMessageIds.add(m.id));
      }
      scheduleRender();
    };

    window.deleteSingleInboxMessage = async function(msgId) {
      const user = getCurrentUser();
      if (!user) return;
      user.messages = (user.messages || []).filter((m) => m.id !== msgId);
      selectedMessageIds.delete(msgId);
      await saveUser(user);
      showToast('Pesan dihapus.', 'info');
      scheduleRender();
    };

    window.deleteSelectedInboxMessages = async function() {
      const user = getCurrentUser();
      if (!user || selectedMessageIds.size === 0) return;
      const delCount = selectedMessageIds.size;
      user.messages = (user.messages || []).filter((m) => !selectedMessageIds.has(m.id));
      selectedMessageIds.clear();
      messageSelectMode = false;
      await saveUser(user);
      showToast(`${delCount} pesan terpilih berhasil dihapus!`, 'success');
      scheduleRender();
    };

    window.handleUploadAvatar = function(e) {

      compressImageFile(file, async (dataUrl) => {

        if (!user) return;
        user.avatar = dataUrl;
        await saveUser(user);
        showToast('Foto profil berhasil diperbarui!', 'success');

    window.selectPresetAvatar = async function(src) {

      if (!user) return;
      user.avatar = src;
      await saveUser(user);
      showToast('Avatar dipilih!', 'success');
      scheduleRender();
    };

    window.saveProfileCredentials = async function() {
      const user = getCurrentUser();
      if (!user) return;

      const newName = (document.getElementById('profNewUsername')?.value || '').trim();
      const rawPrefix = (document.getElementById('profNewEmailPrefix')?.value || '').trim().toLowerCase().replace(/@.*$/, '');
      const newPassword = (document.getElementById('profNewPassword')?.value || '').trim();
      const newCode = (document.getElementById('profNewAccountCode')?.value || '').trim();

      if (!newName) return showToast('Username tidak boleh kosong!', 'error');
      if (!rawPrefix || !/^[a-z0-9._-]+$/.test(rawPrefix)) {
        return showToast('Nama depan email hanya boleh huruf, angka, titik, underscore, atau strip!', 'error');
      }
      if (!newPassword || newPassword.length < 4) {
        return showToast('Password minimal 4 karakter!', 'error');
      }
      if (!newCode) {
        return showToast('Kode Akun tidak boleh kosong!', 'error');
      }

      const oldEmail = user.email;
      const newEmail = `${rawPrefix}@wop.com`;

      if (newEmail !== oldEmail && state.users[newEmail]) {
        return showToast('Email tersebut sudah dipakai akun lain!', 'error');
      }

      user.username = newName.toUpperCase();
      user.password = newPassword;
      user.accountCode = newCode;

      if (newEmail !== oldEmail) {
        user.email = newEmail;
        delete state.users[oldEmail];
        state.users[newEmail] = user;
        state.currentEmail = newEmail;

        // Perbarui referensi email di teman & grup agar tetap terhubung
        Object.values(state.users).forEach((other) => {
          if (!other) return;
          if (Array.isArray(other.friends)) {
            other.friends = other.friends.map((em) => (em === oldEmail ? newEmail : em));
          }
          if (Array.isArray(other.friendRequests)) {
            other.friendRequests = other.friendRequests.map((em) => (em === oldEmail ? newEmail : em));
          }
          if (Array.isArray(other.likedBy)) {
            other.likedBy = other.likedBy.map((em) => (em === oldEmail ? newEmail : em));
          }
        });
        (state.config.groups || []).forEach((g) => {
          if (g.creatorEmail === oldEmail) g.creatorEmail = newEmail;
          if (Array.isArray(g.admins)) g.admins = g.admins.map((em) => (em === oldEmail ? newEmail : em));
          if (Array.isArray(g.members)) g.members = g.members.map((em) => (em === oldEmail ? newEmail : em));
        });

        await deleteCloudUserDoc(oldEmail);
        await saveConfig();
      }

      await saveUser(user);
      showToast('Data Profile, Email, Password & Kode Akun berhasil diperbarui!', 'success');
      scheduleRender();
    };

    window.settleAuctionWinners = async function() {
      const auc = state.config.auction;
      if (!auc || auc.settled) return showToast('Lelang sudah diselesaikan!', 'info');

      const sorted = [...(auc.bids || [])].sort((a, b) => b.amount - a.amount);
      const winners = sorted.slice(0, 3);
      const losers = sorted.slice(3);

      for (let i = 0; i < winners.length; i++) {
        const w = winners[i];
        const serial = `#00${i + 1}`;
        const target = state.users[w.email];
        if (target) {
          target.inventory.push({
            uid: 'auc_win_' + Date.now() + '_' + i,
            name: `${auc.itemName} (${serial})`,
            category: auc.category,
            rarity: auc.rarity,
            hp: auc.hp || 7500,
            damage: auc.damage,
            serialNumber: serial,
            desc: `Pemenang Lelang Nomor Seri ${serial}. ${auc.desc}`,
            image: auc.image
          });
          target.messages.unshift({
            id: 'auc_msg_' + Date.now() + '_' + i,
            title: `🏆 PEMENANG LELANG SERI ${serial}!`,
            body: `Selamat! Kamu memenangkan lelang "${auc.itemName}" dengan Nomor Seri ${serial}! Item sudah masuk ke Penyimpananmu.`,
            from: 'BALAI LELANG',
            time: new Date().toLocaleString('id-ID'),
            read: false
          });
          await saveUser(target);
        }
      }

      for (const l of losers) {
        const target = state.users[l.email];
        if (target) {
          target.diamond = (target.diamond || 0) + l.amount;
          await saveUser(target);
        }
      }

      auc.settled = true;
      await saveConfig();
      showToast('Lelang selesai! Item Seri #001, #002, #003 dibagikan ke pemenang!', 'success');
      scheduleRender();
    };

    function startWopMusic(resetSource = false) {
      if (!state.config.musicEnabled || !state.config.musicUrl) return;
      let audio=document.getElementById('wopThemeMusic');
      if (!audio) { audio=document.createElement('audio'); audio.id='wopThemeMusic'; audio.preload='auto'; audio.volume=0.25; audio.controls=false; audio.loop=true; audio.style.display='none'; document.body.appendChild(audio); }
      if (resetSource || audio.src !== state.config.musicUrl) audio.src=state.config.musicUrl;
      audio.loop=true;
      // Jangan daftarkan musik website sebagai sesi media bernama di Android/Chrome.
      // Browser/OS tetap dapat menampilkan kontrol generik pada sebagian perangkat.
      try {
        if (navigator.mediaSession) {
          navigator.mediaSession.metadata = null;
          navigator.mediaSession.playbackState = 'none';
          ['play','pause','stop','seekbackward','seekforward','previoustrack','nexttrack'].forEach(action => {
            try { navigator.mediaSession.setActionHandler(action, null); } catch (_) {}
          });
        }
      } catch (_) {}
      audio.onended=()=>{ if (state.config.musicEnabled && state.config.musicUrl) { try { audio.currentTime=0; const p=audio.play(); if(p?.catch) p.catch(()=>{}); } catch(e){} } };
      const attempt=()=>{ if (!state.config.musicEnabled) return; const p=audio.play(); if(p?.catch) p.catch(()=>{}); };
      attempt();
      if (!window.__wopMusicGestureBound) {
        window.__wopMusicGestureBound=true;
        const resume=()=>{ const a=document.getElementById('wopThemeMusic'); if(a && a.paused && state.config.musicEnabled) { const p=a.play(); if(p?.catch)p.catch(()=>{}); } };
        ['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,resume,{passive:true}));
      }
    }

    // Jam, periode hari, tanggal, dan bulan mengikuti jam lokal perangkat secara real-time.
    function updateWopLiveClock() {
      const now = new Date();
      const hour = Number(new Intl.DateTimeFormat('id-ID', { hour: '2-digit', hourCycle: 'h23' }).format(now));
      const period = hour >= 4 && hour < 11 ? 'PAGI' : hour >= 11 && hour < 15 ? 'SIANG' : hour >= 15 && hour < 18 ? 'SORE' : 'MALAM';
      const clock = document.getElementById('wopLiveClock');
      const dayPeriod = document.getElementById('wopDayPeriod');
      const fullDate = document.getElementById('wopFullDate');
      const month = document.getElementById('wopLiveMonth');
      if (clock) clock.textContent = new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(now);
      if (dayPeriod) dayPeriod.textContent = period;
      if (fullDate) fullDate.textContent = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
      if (month) month.textContent = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(now);
    }
    updateWopLiveClock();
    setInterval(updateWopLiveClock, 1000);

    // BOOTSTRAP
    loadFromLocal();
    if (state.config.musicEnabled && state.config.musicUrl) startWopMusic(false);
    if (state.currentEmail && state.users[state.currentEmail]) {
      const cur = state.users[state.currentEmail];
      ensureUserAccountIntegrity(cur);
      checkDailyStreakOnLogin(cur);
      cur.isOnline = true;
      cur.lastActive = Date.now();
      saveUser(cur);
      enterGame();
    } else {
      scheduleRender();
    }
  </script>
</body>
</html>
