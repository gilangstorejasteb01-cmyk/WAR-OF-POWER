<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070b14" />
  <title>WAR OF POWER - Battle Royale &amp; Arena Peperangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            gaming: ['Orbitron', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --wop-bg: #070b14;
      --wop-card-bg: rgba(15, 23, 42, 0.88);
      --wop-border: rgba(56, 189, 248, 0.24);
      --wop-glow-1: rgba(6, 182, 212, 0.14);
      --wop-glow-2: rgba(245, 158, 11, 0.12);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100dvh;
      overflow-x: clip;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background-color: var(--wop-bg);
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
    }
    button, a, input, select, textarea {
      touch-action: pan-y manipulation;
    }
    .cyber-grid {
      background-color: var(--wop-bg);
      background-image:
        radial-gradient(circle at 20% 15%, var(--wop-glow-1), transparent 45%),
        radial-gradient(circle at 80% 85%, var(--wop-glow-2), transparent 45%),
        linear-gradient(to right, rgba(30, 41, 59, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(30, 41, 59, 0.35) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
    }
    .theme-bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.34;
      transition: background-image 0.5s ease, opacity 0.5s ease;
    }
    .snow-layer { position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden; display:none; }
    .snow-layer.active { display:block; }
    .snow-layer::before,.snow-layer::after { content:'❄  ·  ❅   · ❄    ❅  ·   ❄'; position:absolute; top:-10%; left:0; width:100%; color:rgba(220,245,255,.75); font-size:18px; letter-spacing:22px; white-space:normal; line-height:72px; text-shadow:0 0 8px #7dd3fc; animation:snowFall 12s linear infinite; }
    .snow-layer::after { left:35%; opacity:.5; animation-duration:18s; animation-delay:-7s; }
    @keyframes snowFall { from { transform:translateY(-10vh); } to { transform:translateY(115vh); } }
    /* Lencana premium: OWNER, VERIFIED V, dan VIP */
    .badge-owner,.badge-v,.badge-vip { position:relative; isolation:isolate; overflow:hidden; vertical-align:middle; white-space:nowrap; }
    .badge-owner {
      display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:8px;
      color:#281500; font-family:'Orbitron',sans-serif; font-size:9px; font-weight:900; letter-spacing:.35px;
      border:1px solid #fff0a6;
      background:linear-gradient(115deg,#8a4b08 0%,#fbbf24 18%,#fff2a8 34%,#e99a12 52%,#fff0a6 70%,#a85b08 100%);
      background-size:220% 100%; text-shadow:0 1px 0 rgba(255,255,255,.45);
      box-shadow:0 0 7px #f59e0b99,0 0 16px #fbbf244d,inset 0 1px 2px #fff9;
      animation:ownerGoldSweep 3.2s ease-in-out infinite, ownerFloat 2.8s ease-in-out infinite;
    }
    .badge-owner::after,.badge-vip::after {
      content:''; position:absolute; z-index:-1; top:-60%; left:-45%; width:32%; height:220%;
      transform:rotate(25deg); background:linear-gradient(90deg,transparent,#ffffffb8,transparent);
      animation:badgeShine 3.6s ease-in-out infinite; pointer-events:none;
    }
    .badge-owner .badge-crown { font-size:12px; line-height:1; filter:drop-shadow(0 0 3px #fff4a8); }
    .badge-v {
      display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px; border-radius:50%;
      color:white; font-family:Arial,sans-serif; font-size:12px; font-weight:1000; font-style:italic;
      border:1.5px solid #d9f5ff; outline:1px solid #0284c7; outline-offset:1px;
      background:radial-gradient(circle at 30% 22%,#a5f3fc 0%,#38bdf8 30%,#2563eb 72%,#172554 100%);
      text-shadow:0 1px 3px #082f49; box-shadow:0 0 7px #38bdf8,0 0 15px #0ea5e966;
      animation:verifiedPop 2.5s ease-in-out infinite;
    }
    .badge-v::after { content:'✓'; position:absolute; right:-3px; bottom:-3px; width:9px; height:9px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; color:#052e16; background:#86efac; border:1px solid #ecfdf5;
      font:900 7px Arial,sans-serif; box-shadow:0 0 5px #4ade80; }
    .badge-vip {
      display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:7px;
      color:#fff0a6; font-family:'Orbitron',sans-serif; font-size:9px; font-weight:900; letter-spacing:.7px;
      border:1px solid #fcd34d; background:linear-gradient(135deg,#422006,#92400e 42%,#451a03);
      box-shadow:0 0 7px #f59e0b80,inset 0 0 7px #fbbf2433;
      text-shadow:0 0 7px #fbbf24; animation:vipAura 2.2s ease-in-out infinite;
    }
    .badge-vip .badge-star { color:#fde68a; font-size:10px; filter:drop-shadow(0 0 4px #fbbf24); }
    .badge-admin { text-shadow:0 0 8px currentColor; box-shadow:0 0 10px rgba(34,211,238,.18); animation:badgePulse 2.8s ease-in-out infinite; }
    @keyframes badgePulse { 50% { filter:brightness(1.22); box-shadow:0 0 14px currentColor; } }
    @keyframes ownerGoldSweep { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
    @keyframes ownerFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-1.5px); } }
    @keyframes badgeShine { 0%,48% { left:-45%; opacity:0; } 58% { opacity:1; } 78%,100% { left:130%; opacity:0; } }
    @keyframes verifiedPop { 0%,100% { transform:scale(1); filter:brightness(1); } 50% { transform:scale(1.1); filter:brightness(1.25); } }
    @keyframes vipAura { 0%,100% { box-shadow:0 0 6px #f59e0b66,inset 0 0 6px #fbbf2422; } 50% { box-shadow:0 0 13px #fbbf2acc,0 0 21px #f59e0b55,inset 0 0 9px #fbbf2455; } }
    @media (prefers-reduced-motion:reduce) { .badge-owner,.badge-owner::after,.badge-v,.badge-vip,.badge-vip::after { animation:none !important; } }
    .glass-card {
      background: var(--wop-card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--wop-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes neonShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes borderPulseGlow {
      0%, 100% {
        box-shadow: 0 0 14px rgba(251, 191, 36, 0.35), 0 0 28px rgba(6, 182, 212, 0.2), inset 0 0 12px rgba(251, 191, 36, 0.12);
        border-color: rgba(251, 191, 36, 0.65);
      }
      50% {
        box-shadow: 0 0 22px rgba(6, 182, 212, 0.55), 0 0 36px rgba(245, 158, 11, 0.35), inset 0 0 16px rgba(6, 182, 212, 0.2);
        border-color: rgba(34, 211, 238, 0.85);
      }
    }
    @keyframes hitShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-1deg); }
      40% { transform: translateX(6px) rotate(1deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    @keyframes floatDamage {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.85); }
      30% { opacity: 1; transform: translate(-50%, -18px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -44px) scale(0.95); }
    }
    @keyframes dragonBlast {
      0% { opacity: 0; transform: scale(0.5); }
      35% { opacity: 1; transform: scale(1.12); }
      100% { opacity: 0; transform: scale(1.35); }
    }
    @keyframes claimGlow {
      0%, 100% {
        box-shadow: 0 0 16px rgba(251, 191, 36, 0.7), 0 0 32px rgba(16, 185, 129, 0.45);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 26px rgba(251, 191, 36, 0.95), 0 0 42px rgba(6, 182, 212, 0.7);
        transform: scale(1.02);
      }
    }
    .animate-hit-shake { animation: hitShake 0.42s ease-in-out; }
    .animate-float-dmg { animation: floatDamage 1.05s ease-out forwards; }
    .animate-dragon-blast { animation: dragonBlast 0.9s ease-out forwards; }
    .animate-claim-btn { animation: claimGlow 1.6s ease-in-out infinite; }

    .credits-banner-glow {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 27, 75, 0.92), rgba(15, 23, 42, 0.96));
      animation: borderPulseGlow 3s ease-in-out infinite;
    }
    .owner-neon-text {
      background: linear-gradient(90deg, #fde047, #f59e0b, #fb7185, #fde047);
      background-size: 250% 250%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: neonShimmer 3s linear infinite;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.65));
    }
    .admin-neon-text {
      background: linear-gradient(90deg, #67e8f9, #38bdf8, #c084fc, #67e8f9);
      background-size: 250% 250%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: neonShimmer 3.5s linear infinite;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.65));
    }

    .ff-box-active {
      border-color: #fbbf24 !important;
      box-shadow: 0 0 22px rgba(251, 191, 36, 0.9), inset 0 0 14px rgba(251, 191, 36, 0.5) !important;
      transform: scale(1.04);
      z-index: 10;
    }
    .rarity-common { border-color: #64748b; }
    .rarity-rare { border-color: #38bdf8; }
    .rarity-epic { border-color: #c084fc; }
    .rarity-legendary { border-color: #fbbf24; }
    .rarity-mythic { border-color: #f43f5e; }
    .rarity-supreme { border-color: #fbbf24; box-shadow: 0 0 18px rgba(251,191,36,.22); }
    .rarity-secret { border-color: #c084fc; box-shadow: 0 0 16px rgba(192,132,252,.2); }
    .rarity-tinggi { border-color: #38bdf8; }
  </style>
</head>
<body class="cyber-grid min-h-screen flex flex-col relative">

  <!-- DYNAMIC THEME BACKGROUND LAYER -->
  <div id="themeBgLayer" class="theme-bg-overlay"></div>
  <div id="snowLayer" class="snow-layer" aria-hidden="true"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastBox" class="fixed top-3 left-1/2 -translate-x-1/2 z-[120] hidden max-w-[92vw]">
    <div id="toastContent" class="px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl border backdrop-blur-md text-center"></div>
  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-3 overflow-y-auto">
    <div id="modalBox" class="glass-card rounded-2xl w-full max-w-md p-4 border border-cyan-400/40 relative my-auto"></div>
  </div>

  <!-- FULLSCREEN OVERLAY CONTAINER (CHAT TEMAN & GRUP LAYAR PENUH) -->
  <div id="fullscreenOverlay" class="fixed inset-0 z-[80] hidden flex-col bg-[#070b14]"></div>

  <!-- AUTH SCREEN -->
  <section id="authScreen" class="relative z-10 min-h-[100dvh] flex flex-col justify-center items-center p-3 sm:p-4">
    <div class="w-full max-w-md glass-card rounded-3xl p-4 sm:p-6 border border-cyan-500/30">
      <div class="text-center mb-4">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/15 border border-cyan-400/30 mb-2 flex-wrap justify-center">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="authServerTag" class="text-[10px] font-bold tracking-wider text-cyan-300 uppercase">ONLINE SERVER READY</span>
          <button type="button" onclick="showVersionModal()" id="authVersionBadge" class="text-[10px] font-gaming font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/40">v2.7.0</button>
          <span id="authThemeBadge" class="text-[10px] font-gaming font-bold px-2 py-0.5 rounded bg-purple-500/20 text-purple-200 border border-purple-400/40">🎨 CYBER ARENA</span>
        </div>

        <div class="w-14 h-14 mx-auto mb-2 rounded-2xl bg-gradient-to-br from-cyan-500/25 via-slate-900 to-amber-500/25 border border-cyan-400/50 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.3)]">
          <svg class="w-8 h-8 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" stroke="#38bdf8" fill="rgba(56,189,248,0.14)"/>
            <path d="M12 6l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7L12 6z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2"/>
          </svg>
        </div>

        <h1 class="font-gaming text-2xl sm:text-3xl font-black tracking-wider bg-gradient-to-r from-cyan-300 via-white to-amber-300 bg-clip-text text-transparent drop-shadow-[0_0_12px_rgba(56,189,248,0.4)]">
          WAR OF POWER
        </h1>
        <p class="text-[11px] text-slate-400 mt-0.5">Hero Battle Arena, Luky Royale &amp; Serial Auction</p>

        <div class="mt-3 p-3 rounded-2xl credits-banner-glow border text-center space-y-1.5 relative overflow-hidden">
          <div class="flex items-center justify-center gap-1.5">
            <span class="text-sm">👑</span>
            <span class="font-gaming text-xs sm:text-sm font-black tracking-widest owner-neon-text">
              OWNER GILANG
            </span>
            <span class="text-sm">👑</span>
          </div>
          <div class="h-px w-3/4 mx-auto bg-gradient-to-r from-transparent via-cyan-400/50 to-transparent"></div>
          <div class="flex items-center justify-center gap-1.5">
            <span class="text-xs">🛡️</span>
            <span class="font-gaming text-[11px] sm:text-xs font-extrabold tracking-wider admin-neon-text">
              ADMIN: KENZIE &amp; ALQI
            </span>
            <span class="text-xs">⚡</span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-950/90 border border-slate-800 mb-4">
        <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="py-2 rounded-lg text-xs font-gaming font-bold bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 shadow">
          LOGIN AKUN
        </button>
        <button type="button" id="tabRegisterBtn" onclick="switchAuthTab('register')" class="py-2 rounded-lg text-xs font-gaming font-bold text-slate-400 hover:text-white">
          DAFTAR BARU
        </button>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">EMAIL (AKUN LAMA ATAU @wop.com)</label>
          <p class="text-[10px] text-slate-500 mb-1">Akun lama tetap gunakan email lamanya. Akun baru memakai @wop.com.</p>
          <input id="loginEmail" type="email" required placeholder="contoh@wop.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-cyan-400 outline-none" />
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">PASSWORD</label>
          <div class="relative">
            <input id="loginPassword" type="password" required placeholder="Masukkan password..." class="w-full pl-3.5 pr-24 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-cyan-400 outline-none" />
            <button type="button" onclick="togglePasswordVisibility('loginPassword', 'loginEyeLabel')" class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 rounded-lg bg-slate-800/90 border border-slate-600 text-[10px] font-bold text-cyan-300 flex items-center gap-1 hover:border-cyan-400">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span id="loginEyeLabel">LIHAT</span>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">KODE AKUN</label>
          <input id="loginAccountCode" type="text" required placeholder="Contoh: XXX-XXX-XXX" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white font-mono focus:border-cyan-400 outline-none" />
        </div>
        <button type="submit" class="w-full py-3 rounded-xl font-gaming font-extrabold text-xs tracking-wider bg-gradient-to-r from-cyan-400 via-sky-500 to-blue-600 text-slate-950 shadow-lg active:scale-[0.98] transition">
          MASUK KE ARENA
        </button>
      </form>

      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-3 hidden">
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">USERNAME</label>
          <input id="regUsername" type="text" required maxlength="18" placeholder="Nama panggilan pemain..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-cyan-400 outline-none" />
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">EMAIL (Wajib akhiran @wop.com)</label>
          <input id="regEmail" type="email" required placeholder="namakamu@wop.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-cyan-400 outline-none" />
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">PASSWORD</label>
          <div class="relative">
            <input id="regPassword" type="password" required minlength="4" placeholder="Buat password kuat..." class="w-full pl-3.5 pr-24 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-cyan-400 outline-none" />
            <button type="button" onclick="togglePasswordVisibility('regPassword', 'regEyeLabel')" class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 rounded-lg bg-slate-800/90 border border-slate-600 text-[10px] font-bold text-cyan-300 flex items-center gap-1 hover:border-cyan-400">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span id="regEyeLabel">LIHAT</span>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1">KODE AKUN</label>
          <input id="regAccountCode" type="text" required placeholder="Contoh: XXX-XXX-XXX" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white font-mono focus:border-cyan-400 outline-none" />
        </div>
        <button type="submit" class="w-full py-3 rounded-xl font-gaming font-extrabold text-xs tracking-wider bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 shadow-lg active:scale-[0.98] transition">
          DAFTAR &amp; MAIN SEKARANG
        </button>
      </form>
    </div>
  </section>

  <!-- MAIN GAME SHELL -->
  <div id="gameScreen" class="relative z-10 hidden flex-col min-h-[100dvh] pb-24">
    <!-- TOP HEADER -->
    <header class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-cyan-500/25 px-2.5 sm:px-3 py-2">
      <div class="max-w-3xl mx-auto space-y-2">
        <div class="flex items-center justify-between gap-2 min-w-0">
          <div onclick="navigateTo('profile')" class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer">
            <img id="hdrAvatar" src="" alt="Avatar" class="w-9 h-9 rounded-xl object-cover border-2 border-cyan-400 shrink-0 bg-slate-900" />
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1 flex-wrap">
                <span id="hdrUsername" class="font-gaming font-extrabold text-xs text-white truncate">PLAYER</span>
                <span id="hdrBadges" class="inline-flex items-center gap-1 flex-wrap"></span>
              </div>
              <div class="flex items-center gap-1 text-[10px] text-slate-400 font-semibold truncate">
                <span id="hdrId" class="text-cyan-300 font-mono shrink-0">WOP-0000</span>
                <span>•</span>
                <span id="hdrRank" class="text-amber-300 truncate">Bronze</span>
                <span>•</span>
                <span id="hdrLevel" class="shrink-0">Lv.1</span>
              </div>
            </div>
          </div>

          <div id="hdrStaffBtnWrap" class="shrink-0"></div>
        </div>

        <div class="flex items-center justify-between gap-1.5 w-full min-w-0">

      } else if (p.includes('ramadhan') || p.includes('lebaran') || p.includes('emas') || p.includes('sultan') || p.includes('gurun')) {
        cTop = '#051b14'; cMid = '#064e3b'; cBot = '#422006'; glow = '#10b981'; accent = '#fbbf24';
        mode = 'sultan';
      } else if (p.includes('hutan') || p.includes('alam') || p.includes('hijau') || p.includes('jungle')) {
        cTop = '#03150c'; cMid = '#064e3b'; cBot = '#14532d'; glow = '#34d399'; accent = '#a3e635';
        mode = 'forest';
      }

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, cTop);
      grad.addColorStop(0.55, cMid);
      grad.addColorStop(1, cBot);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Aura bulan / matahari / portal energi di langit
      const orbGrad = ctx.createRadialGradient(360, 290, 20, 360, 290, 260);
      orbGrad.addColorStop(0, glow);
      orbGrad.addColorStop(0.45, accent + '66');
      orbGrad.addColorStop(1, 'transparent');
      ctx.fillStyle = orbGrad;
      ctx.beginPath();
      ctx.arc(360, 290, 260, 0, Math.PI * 2);
      ctx.fill();

      // Bintang & partikel bercahaya
      for (let i = 0; i < 95; i++) {
        const sx = (i * 173 + 41) % canvas.width;
        const sy = (i * 293 + 97) % 860;
        const sr = (i % 3) + 1.2;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.65)' : glow;
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }

      if (mode === 'halloween') {
        // Bulan purnama jingga besar
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.arc(360, 270, 115, 0, Math.PI * 2);
        ctx.fill();

        // Siluet Kastil Halloween & Pepohonan Angker
        ctx.fillStyle = '#09030f';
        ctx.beginPath();
        ctx.moveTo(0, 1280);
        ctx.lineTo(0, 860);
        ctx.lineTo(90, 820);
        ctx.lineTo(130, 680);
        ctx.lineTo(165, 620);
        ctx.lineTo(200, 680);
        ctx.lineTo(230, 790);
        ctx.lineTo(310, 760);
        ctx.lineTo(360, 560);
        ctx.lineTo(410, 760);
        ctx.lineTo(490, 790);
        ctx.lineTo(525, 650);
        ctx.lineTo(560, 595);
        ctx.lineTo(595, 650);
        ctx.lineTo(630, 830);
        ctx.lineTo(720, 870);
        ctx.lineTo(720, 1280);
        ctx.closePath();
        ctx.fill();

        // Jendela kastil menyala
        ctx.fillStyle = '#fde047';
        [158, 352, 552].forEach((wx, idx) => {
          ctx.fillRect(wx, 690 + idx * 12, 16, 28);
        });

        // Kelelawar terbang
        ctx.strokeStyle = '#09030f';
        ctx.lineWidth = 4;
        [[210, 230], [490, 200], [540, 310], [160, 340]].forEach(([bx, by]) => {
          ctx.beginPath();
          ctx.moveTo(bx - 22, by);
          ctx.quadraticCurveTo(bx - 10, by - 14, bx, by);
          ctx.quadraticCurveTo(bx + 10, by - 14, bx + 22, by);
          ctx.stroke();
        });

        // Jack-O-Lantern Labu Menyala di bawah
        const drawPumpkin = (px, py, r) => {
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.ellipse(px, py, r * 1.15, r * 0.9, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#7c2d12';
          ctx.lineWidth = 3;
          ctx.stroke();
          // Mata & mulut menyala
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.moveTo(px - r * 0.45, py - r * 0.15);
          ctx.lineTo(px - r * 0.2, py - r * 0.35);
          ctx.lineTo(px - r * 0.1, py - r * 0.1);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(px + r * 0.45, py - r * 0.15);
          ctx.lineTo(px + r * 0.2, py - r * 0.35);
          ctx.lineTo(px + r * 0.1, py - r * 0.1);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(px, py + r * 0.15, r * 0.45, 0.1 * Math.PI, 0.9 * Math.PI);
          ctx.fill();
        };
        drawPumpkin(165, 1080, 56);
        drawPumpkin(555, 1090, 62);
      } else if (mode === 'fire') {
        // Gunung berapi & pilar api naga
        ctx.fillStyle = '#1c0608';
        ctx.beginPath();
        ctx.moveTo(0, 1280);
        ctx.lineTo(0, 920);
        ctx.lineTo(250, 680);
        ctx.lineTo(360, 740);
        ctx.lineTo(480, 660);
        ctx.lineTo(720, 930);
        ctx.lineTo(720, 1280);
        ctx.closePath();
        ctx.fill();

        // Aliran lava menyala
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.moveTo(310, 720);
        ctx.quadraticCurveTo(280, 920, 210, 1180);
        ctx.moveTo(430, 700);
        ctx.quadraticCurveTo(470, 910, 520, 1180);
        ctx.stroke();
      } else if (mode === 'winter') {
        // Pegunungan Kristal Es & Salju
        ctx.fillStyle = '#082f49';
        ctx.beginPath();
        ctx.moveTo(0, 1280);
        ctx.lineTo(0, 880);
        ctx.lineTo(190, 640);
        ctx.lineTo(360, 810);
        ctx.lineTo(540, 610);
        ctx.lineTo(720, 870);
        ctx.lineTo(720, 1280);
        ctx.closePath();
        ctx.fill();

        // Puncak es bersinar
        ctx.fillStyle = 'rgba(224,242,254,0.45)';
        ctx.beginPath();
        ctx.moveTo(190, 640); ctx.lineTo(130, 730); ctx.lineTo(240, 725); ctx.closePath();
        ctx.moveTo(540, 610); ctx.lineTo(480, 710); ctx.lineTo(600, 705); ctx.closePath();
        ctx.fill();
      } else if (mode === 'sultan') {
        // Kubah istana emas & bulan sabit
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(360, 250, 75, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = cTop;
        ctx.beginPath();
        ctx.arc(388, 232, 65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#042f2e';
        ctx.beginPath();
        ctx.moveTo(0, 1280);
        ctx.lineTo(0, 900);
        ctx.quadraticCurveTo(180, 780, 360, 900);
        ctx.quadraticCurveTo(540, 780, 720, 900);
        ctx.lineTo(720, 1280);
        ctx.closePath();
        ctx.fill();
      } else {
        // Grid Perspektif Arena Cyber
        ctx.strokeStyle = glow + '33';
        ctx.lineWidth = 2;
        for (let y = 760; y <= 1280; y += 45) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(720, y);
          ctx.stroke();
        }
        for (let x = -360; x <= 1080; x += 90) {
          ctx.beginPath();
          ctx.moveTo(360, 760);
          ctx.lineTo(x, 1280);
          ctx.stroke();
        }
      }

      return {
        dataUrl: canvas.toDataURL('image/jpeg', 0.86),
        bgColor: cTop,
        cardBg: mode === 'halloween' ? 'rgba(26, 11, 38, 0.88)' : mode === 'fire' ? 'rgba(34, 10, 14, 0.88)' : mode === 'winter' ? 'rgba(8, 32, 54, 0.88)' : mode === 'sultan' ? 'rgba(6, 40, 32, 0.88)' : 'rgba(15, 23, 42, 0.88)',
        borderColor: glow + '55',
        glow1: glow + '2b',
        glow2: accent + '26'
      };
    }

    function generateItemArtworkDataUrl(promptText = '', category = 'HERO') {
      const canvas = document.createElement('canvas');
      canvas.width = 280;
      canvas.height = 280;
      const ctx = canvas.getContext('2d');
      const p = (promptText + ' ' + category).toLowerCase();

      let c1 = '#0284c7', c2 = '#1e3a8a', ring = '#38bdf8', icon = '⚔️';
      if (p.includes('halloween') || p.includes('labu') || p.includes('pumpkin') || p.includes('seram')) {
        c1 = '#ea580c'; c2 = '#3b0764'; ring = '#fb923c'; icon = '🎃';
      } else if (p.includes('naga') || p.includes('dragon') || p.includes('api') || p.includes('fire')) {
        c1 = '#dc2626'; c2 = '#7c2d12'; ring = '#fbbf24'; icon = '🐉';
      } else if (p.includes('es') || p.includes('ice') || p.includes('kristal') || p.includes('biru')) {
        c1 = '#06b6d4'; c2 = '#0f172a'; ring = '#67e8f9'; icon = '❄️';
      } else if (p.includes('petir') || p.includes('halilintar') || p.includes('emas') || p.includes('raja') || p.includes('pangeran')) {
        c1 = '#d97706'; c2 = '#451a03'; ring = '#fde047'; icon = '👑';
      } else if (p.includes('perisai') || p.includes('shield') || p.includes('tameng')) {
        c1 = '#0891b2'; c2 = '#1e293b'; ring = '#22d3ee'; icon = '🔰';
      } else if (p.includes('medkit') || p.includes('obat') || p.includes('heal') || p.includes('elixir')) {
        c1 = '#059669'; c2 = '#064e3b'; ring = '#34d399'; icon = '💊';
      } else if (p.includes('pedang') || p.includes('sword')) {
        c1 = '#7c3aed'; c2 = '#1e1b4b'; ring = '#c084fc'; icon = '🗡️';
      }

      const bgGrad = ctx.createLinearGradient(0, 0, 280, 280);
      bgGrad.addColorStop(0, c1);
      bgGrad.addColorStop(1, c2);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 280, 280);

      // Aura lingkaran energi
      const aura = ctx.createRadialGradient(140, 130, 15, 140, 130, 125);
      aura.addColorStop(0, 'rgba(255,255,255,0.35)');
      aura.addColorStop(0.6, ring + '55');
      aura.addColorStop(1, 'transparent');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(140, 130, 125, 0, Math.PI * 2);
      ctx.fill();

      // Bingkai geometris
      ctx.strokeStyle = ring;
      ctx.lineWidth = 6;
      ctx.strokeRect(14, 14, 252, 252);

      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(140, 125, 76, 0, Math.PI * 2);
      ctx.stroke();

      // Partikel kilau
      for (let i = 0; i < 18; i++) {
        const px = 30 + ((i * 53) % 220);
        const py = 30 + ((i * 79) % 220);
        ctx.fillStyle = i % 2 === 0 ? '#ffffff' : ring;
        ctx.beginPath();
        ctx.arc(px, py, (i % 3) + 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ikon utama besar di tengah
      ctx.font = '84px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(icon, 140, 122);

      // Label nama item di bawah
      const shortTitle = (promptText || category).toUpperCase().slice(0, 18);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(24, 212, 232, 36);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 15px Orbitron, Arial, sans-serif';
      ctx.fillText(shortTitle, 140, 231);

      return canvas.toDataURL('image/png');
    }

      root.style.setProperty('--wop-glow-2', cfgTheme.glow2 || 'rgba(245, 158, 11, 0.12)');

      const bgLayer = document.getElementById('themeBgLayer');
      if (bgLayer) {
        if (cfgTheme.bgImage) {
          bgLayer.style.backgroundImage = `url("${cfgTheme.bgImage}")`;

          bgLayer.style.backgroundImage = 'none';
          bgLayer.style.opacity = '0';

      if (snow) snow.classList.toggle('active', /winter|salju|kristal es/i.test(cfgTheme.name || ''));

      if (authThemeBadge) {
        authThemeBadge.textContent = `🎨 ${cfgTheme.name || 'CYBER ARENA'}`;
      }
    }

      if (cat === 'ARMOR') {
        it.category = 'PERISAI';
        it.hp = it.hp || Number(it.damage || 600);
      } else if (cat === 'KEKUATAN') {
        it.category = 'HERO';
        it.hp = it.hp || 3200;
      } else if (cat === 'BOM') {
        it.category = 'PUSAKA SAKTI';
        it.hp = it.hp || 400;

      }
      return it;

        if (migrateLegacy && (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential')) {

    function extractNumericWopId(idStr) {
      const m = String(idStr || '').match(/(\d+)/);
      return m ? parseInt(m[1], 10) : 0;
    }

    function generateSequentialPlayerId() {
      const allUsers = Object.values(state.users || {});
      let maxNum = 0;
      allUsers.forEach((u) => {
        const num = extractNumericWopId(u && u.id);
        if (num > maxNum) maxNum = num;
      });
      const existingIds = new Set(allUsers.map((u) => String(u.id || '').toUpperCase()));
      let nextNum = Math.max(maxNum + 1, allUsers.length + 1);
      let candidate = '';
      do {
        candidate = 'WOP-' + String(nextNum).padStart(4, '0');
        nextNum++;
      } while (existingIds.has(candidate));
      return candidate;
    }

      const numB = extractNumericWopId(b && b.id);
      if (numA !== numB) return numA - numB;
      return String(a?.id || '').localeCompare(String(b?.id || ''));
    }

    function findUserByQuery(query) {
      const q = String(query || '').trim().toLowerCase();
      if (!q) return null;
      const numericOnly = q.replace(/^wop-/, '');
      const all = Object.values(state.users);
      return (
        all.find((u) => u.id && u.id.toLowerCase() === q) ||
        all.find((u) => u.id && u.id.toLowerCase().replace(/^wop-/, '') === numericOnly) ||
        all.find((u) => u.username && u.username.toLowerCase() === q) ||
        all.find((u) => u.username && u.username.toLowerCase().includes(q)) ||
        null
      );
    }

    function playBeep(freq = 520, duration = 0.06) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function compressImageFile(file, callback, maxSide = 220) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxSide) {
            h = Math.round((h * maxSide) / w);
            w = maxSide;
          } else if (h > maxSide) {
            w = Math.round((w * maxSide) / h);
            h = maxSide;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function detectProfanity(text) {
      const raw = String(text || '').toLowerCase();
      if (!raw.trim()) return null;
      const normalized = raw
        .replace(/0/g, 'o')
        .replace(/1/g, 'i')
        .replace(/3/g, 'e')
        .replace(/4/g, 'a')
        .replace(/5/g, 's')
        .replace(/7/g, 't')
        .replace(/@/g, 'a')
        .replace(/\$/g, 's')
        .replace(/[^a-z0-9\s]/g, ' ');

      const compact = normalized.replace(/\s+/g, '');
      const words = normalized.split(/\s+/).filter(Boolean);
      const badList = (state.config.groupModeration && state.config.groupModeration.badWords) || DEFAULT_BAD_WORDS;

      for (const bad of badList) {
        const cleanBad = String(bad || '').trim().toLowerCase();
        if (!cleanBad) continue;
        if (words.includes(cleanBad)) return cleanBad;
        if (cleanBad.length >= 4 && compact.includes(cleanBad)) return cleanBad;
      }
      return null;
    }

    function checkDailyStreakOnLogin(user) {
      if (!user.stats) {
        user.stats = { lastLoginDate: '', loginStreak: 0, claimedDaily: [], topupCount: 0, claimedTopup: [], spinCount: 0, claimedSpin: [] };
      }
      const today = getTodayDateStr();
      const last = user.stats.lastLoginDate;
      if (!last) {
        user.stats.lastLoginDate = today;
        user.stats.loginStreak = 1;
      } else if (last !== today) {
        const diff = diffCalendarDays(last, today);
        if (diff === 1) {
          user.stats.loginStreak = (user.stats.loginStreak || 0) + 1;
        } else if (diff > 1) {
          user.stats.loginStreak = 1;
          user.stats.claimedDaily = [];
        }
        user.stats.lastLoginDate = today;
      }
    }

    window.copyPlayerId = async function(id) {
      const value = String(id || '');
      if (!value) return showToast('Tidak ada teks untuk disalin.', 'error');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
          return showToast('Berhasil disalin ke clipboard!', 'success');
        }
        throw new Error('Clipboard API tidak tersedia pada halaman ini');
      } catch (_) {
        openModal(`
          <div class="space-y-3">
            <h3 class="font-gaming font-black text-sm text-cyan-300">SALIN TEKS</h3>
            <p class="text-xs text-slate-300">Browser membatasi akses clipboard pada halaman ini. Tekan lama teks di bawah, pilih <b>Salin</b>.</p>
            <textarea id="manualCopyValue" readonly class="w-full min-h-[92px] p-3 rounded-xl bg-slate-950 border border-cyan-400 text-sm text-white select-all" onclick="this.select()">${escapeHTML(value)}</textarea>
            <button onclick="document.getElementById('manualCopyValue').focus();document.getElementById('manualCopyValue').select();showToast('Teks sudah dipilih. Tekan lama lalu pilih Salin.','info')" class="w-full py-2.5 rounded-xl bg-cyan-400 text-slate-950 font-gaming font-black text-xs">PILIH TEKS UNTUK DISALIN</button>
            <button onclick="closeModal()" class="w-full py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">TUTUP</button>
          </div>
        `);
        setTimeout(() => { const el = document.getElementById('manualCopyValue'); if (el) { el.focus(); el.select(); } }, 60);
      }
    };

    function initBattleSetupDefaults() {
      const user = getCurrentUser();
      if (!user) return;
      ensureUserAccountIntegrity(user);
      const inv = user.inventory || [];
      const heroes = inv.filter((i) => i.category === 'HERO');
      const shields = inv.filter((i) => i.category === 'PERISAI');
      const medkits = inv.filter((i) => i.category === 'MEDKIT');
      const pusakas = inv.filter((i) => i.category === 'PUSAKA SAKTI');

      if (!heroes.some((h) => h.uid === battleState.selectedHeroUid)) {
        battleState.selectedHeroUid = heroes[0] ? heroes[0].uid : '';
      }
      if (!shields.some((s) => s.uid === battleState.selectedShieldUid)) {
        battleState.selectedShieldUid = shields[0] ? shields[0].uid : '';
      }
      battleState.selectedMedkitUids = battleState.selectedMedkitUids.filter((uid) => medkits.some((m) => m.uid === uid));
      if (battleState.selectedMedkitUids.length < 3 && medkits.length >= 3) {
        battleState.selectedMedkitUids = medkits.slice(0, 3).map((m) => m.uid);
      }
      if (!pusakas.some((p) => p.uid === battleState.selectedPusakaUid)) {
        battleState.selectedPusakaUid = pusakas[0] ? pusakas[0].uid : '';
      }
    }

      const candidates = NATURAL_PRO_PLAYERS.filter((p) => !excludeNames.has(p.username));
      const pick = candidates[Math.floor(Math.random() * candidates.length)] || NATURAL_PRO_PLAYERS[0];
      excludeNames.add(pick.username);

      const heroPool = [

              </button>
            </div>

            ${Number(String(battleState.mode).split('v')[0]) > 1 ? `
              <div class="p-2.5 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
                <div class="text-[10px] font-bold text-emerald-300">🤝 TEMAN ONLINE TERSEDIA (${onlineFriends.length})</div>
                ${onlineFriends.length === 0 ? `
                  <p class="text-[10px] text-slate-400">Tidak ada teman yang sedang online saat ini. Klik <b>🔍 CARI PEMAIN JAGO</b> untuk mencari rekan tim jago otomatis!</p>
                ` : `
                  <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    ${onlineFriends.map((f) => {
                      const added = battleState.allies.some((a) => a.email === f.email);
                      return `
                        <button onclick="inviteOnlineFriendToTeam('${f.email}')" class="px-2.5 py-1.5 rounded-xl border text-left shrink-0 flex items-center gap-2 ${added ? 'bg-emerald-500/20 border-emerald-400' : 'bg-slate-900 border-slate-700'}">
                          <img src="${f.avatar}" class="w-7 h-7 rounded-lg object-cover" />
                          <div>
                            <div class="text-[11px] font-bold text-white">${escapeHTML(f.username)}</div>

                          </div>
                        </button>

                    }).join('')}
                  </div>
                `}
              </div>
            ` : ''}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div class="p-2.5 rounded-xl bg-slate-950/90 border border-cyan-500/30 space-y-1.5">
                <div class="text-[10px] font-gaming font-bold text-cyan-300">🔵 TIM KAMU (${1 + battleState.allies.length}/${1 + neededAllies})</div>
                <div class="p-2 rounded-lg bg-slate-900 border border-cyan-400/50 flex items-center gap-2">
                  <img src="${user.avatar}" class="w-7 h-7 rounded-lg object-cover" />
                  <div class="min-w-0">
                    <div class="text-[11px] font-bold text-white truncate">${escapeHTML(user.username)} (KAMU)</div>
                    <div class="text-[9px] text-cyan-300">Siap Bertempur</div>
                  </div>
                </div>
                ${battleState.allies.map((a) => `
                  <div class="p-2 rounded-lg bg-slate-900 border border-slate-700 flex items-center gap-2">
                    <img src="${a.avatar}" class="w-7 h-7 rounded-lg object-cover" />
                    <div class="min-w-0 flex-1">
                      <div class="text-[11px] font-bold text-white truncate">${escapeHTML(a.username)}</div>
                      <div class="text-[9px] text-amber-300 truncate">${escapeHTML(a.hero.name)} • ${a.rank}</div>
                    </div>
                  </div>
                `).join('')}
              </div>

              <div class="p-2.5 rounded-xl bg-slate-950/90 border border-rose-500/30 space-y-1.5">
                <div class="text-[10px] font-gaming font-bold text-rose-400">🔴 TIM LAWAN (${battleState.enemies.length}/${neededEnemies})</div>
                ${battleState.enemies.length === 0 ? `
                  <div class="py-4 text-center text-[10px] text-slate-400">Klik <b>🔍 CARI PEMAIN JAGO</b> untuk mencari lawan!</div>
                ` : battleState.enemies.map((en) => `
                  <div class="p-2 rounded-lg bg-slate-900 border border-rose-500/30 flex items-center gap-2">
                    <img src="${en.avatar}" class="w-7 h-7 rounded-lg object-cover" />
                    <div class="min-w-0 flex-1">
                      <div class="text-[11px] font-bold text-white truncate">${escapeHTML(en.username)}</div>
                      <div class="text-[9px] text-rose-300 truncate">${escapeHTML(en.hero.name)} • ${en.rank}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <button onclick="startBattleMatch()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 via-orange-500 to-amber-400 text-slate-950 font-gaming font-black text-sm tracking-wider shadow-[0_0_25px_rgba(244,63,94,0.5)] active:scale-[0.98] transition">
            ${squadReady ? '⚔️ MASUK KE ARENA PERTEMPURAN SEKARANG!' : '🔍 CARI LAWAN & MULAI PEPERANGAN!'}
          </button>
        </div>
      `;
    }

    window.setBattleMode = function(mode) {
      battleState.mode = mode;
      battleState.allies = [];
      battleState.enemies = [];
      scheduleRender();
    };

    window.selectBattleHero = function(uid) {
      battleState.selectedHeroUid = uid;
      scheduleRender();
    };

    window.selectBattleShield = function(uid) {
      battleState.selectedShieldUid = uid;
      scheduleRender();
    };

    window.selectBattlePusaka = function(uid) {
      battleState.selectedPusakaUid = battleState.selectedPusakaUid === uid ? '' : uid;
      scheduleRender();
    };

    window.toggleBattleMedkit = function(uid) {
      const idx = battleState.selectedMedkitUids.indexOf(uid);
      if (idx >= 0) {
        battleState.selectedMedkitUids.splice(idx, 1);
      } else {
        if (battleState.selectedMedkitUids.length >= 3) {
          battleState.selectedMedkitUids.shift();
        }
        battleState.selectedMedkitUids.push(uid);
      }
      scheduleRender();
    };

    window.buyEmergencyMedkitPack = async function() {
      const user = getCurrentUser();
      if (!user) return;
      for (let i = 0; i < 3; i++) {
        user.inventory.push({
          uid: `med_pack_${Date.now()}_${i}`,
          name: 'Medkit Taktis',
          category: 'MEDKIT',
          rarity: 'COMMON',
          hp: 750,
          damage: 0,
          desc: 'Kotak medis lapangan memulihkan +750 HP Hero saat bertempur.',
          image: makeSvgBadge('MEDKIT', '#059669', '#064e3b', '💊')
        });
      }
      await saveUser(user);
      initBattleSetupDefaults();
      showToast('+3 Medkit Taktis berhasil ditambahkan ke Tas!', 'success');
      scheduleRender();
    };

    window.inviteOnlineFriendToTeam = function(friendEmail) {
      if (Number(String(battleState.mode).split('v')[0]) <= 1) return;
      const friend = state.users[friendEmail];
      if (!friend) return;
      const existingIdx = battleState.allies.findIndex((a) => a.email === friendEmail);
      if (existingIdx >= 0) {
        battleState.allies.splice(existingIdx, 1);
        scheduleRender();
        return;
      }
      if (battleState.allies.length >= 2) {
        return showToast('Tim sudah penuh (Maksimal 3 pemain termasuk kamu)!', 'info');
      }
      ensureUserAccountIntegrity(friend);
      const fHero = (friend.inventory || []).find((i) => i.category === 'HERO') || createStarterInventory(friend.id)[0];
      const fShield = (friend.inventory || []).find((i) => i.category === 'PERISAI') || createStarterInventory(friend.id)[1];
      const fPusaka = (friend.inventory || []).find((i) => i.category === 'PUSAKA SAKTI') || createStarterInventory(friend.id)[5];

      battleState.allies.push({
        id: friend.id,
        email: friend.email,
        username: friend.username,
        rank: friend.rank,
        level: friend.level,
        avatar: friend.avatar,
        isFriend: true,
        hero: fHero,
        shield: fShield,
        pusaka: fPusaka
      });
      showToast(`${friend.username} bergabung ke tim kamu!`, 'success');
      scheduleRender();
    };

    window.findSmartMatchmakingSquad = function() {
      const user = getCurrentUser();
      if (!user) return;
      const usedNames = new Set([user.username, ...battleState.allies.map((a) => a.username)]);
      const teamSize = Math.max(1, Number(String(battleState.mode).split('v')[0]) || 1);
      const neededAllies = teamSize - 1;
      const neededEnemies = teamSize;

      while (battleState.allies.length < neededAllies) {
        battleState.allies.push(generateProPlayerCombatant(usedNames));
      }
      battleState.enemies = [];
      for (let i = 0; i < neededEnemies; i++) {
        battleState.enemies.push(generateProPlayerCombatant(usedNames));
      }
      playBeep(720, 0.09);
      showToast('Rekan tim & lawan pemain tangguh ditemukan!', 'success');
      scheduleRender();
    };

    window.startBattleMatch = function() {
      const user = getCurrentUser();
      if (!user) return;
      initBattleSetupDefaults();

      const inv = user.inventory || [];
      const hero = inv.find((i) => i.uid === battleState.selectedHeroUid && i.category === 'HERO');
      const shield = inv.find((i) => i.uid === battleState.selectedShieldUid && i.category === 'PERISAI');
      const medkits = battleState.selectedMedkitUids
        .map((uid) => inv.find((i) => i.uid === uid && i.category === 'MEDKIT'))
        .filter(Boolean);
      const pusaka = inv.find((i) => i.uid === battleState.selectedPusakaUid && i.category === 'PUSAKA SAKTI') || null;

      if (!hero) return showToast('Wajib pilih minimal 1 Hero terlebih dahulu!', 'error');
      if (!shield) return showToast('Wajib pilih minimal 1 Perisai terlebih dahulu!', 'error');
      if (medkits.length < 3) return showToast('Wajib pilih minimal 3 Medkit penyembuhan!', 'error');

      const teamSize = Math.max(1, Number(String(battleState.mode).split('v')[0]) || 1);
      const neededAllies = teamSize - 1;
      const neededEnemies = teamSize;
      if (battleState.allies.length < neededAllies || battleState.enemies.length < neededEnemies) {
        findSmartMatchmakingSquad();
      }

      const avgMedkitHeal = Math.round(medkits.reduce((s, m) => s + Number(m.hp || 750), 0) / medkits.length);

      const buildUnit = (pData, isMe = false) => {
        const maxHp = Number(pData.hero.hp || 3000);
        const startShield = Math.round(Number(pData.shield?.hp || 650) * 0.5);
        return {
          uid: (isMe ? 'me_' : 'unit_') + pData.id + '_' + Math.random().toString(36).slice(2, 5),
          id: pData.id,
          username: pData.username,
          avatar: pData.avatar,
          rank: pData.rank,
          isMe,
          hero: pData.hero,
          shieldItem: pData.shield,
          pusakaItem: pData.pusaka,
          maxHp,
          hp: maxHp,
          maxShield: Number(pData.shield?.hp || 650),
          shield: startShield,
          medkitsLeft: isMe ? 3 : 2,
          medkitHeal: isMe ? avgMedkitHeal : 750,
          pusakaCooldown: 0,
          totalDamageDealt: 0
        };
      };

      const meUnit = buildUnit({
        id: user.id,
        username: user.username,
        avatar: user.avatar,
        rank: user.rank,
        hero,
        shield,
        pusaka
      }, true);

      battleState.allyTeam = [meUnit, ...battleState.allies.map((a) => buildUnit(a, false))];
      battleState.enemyTeam = battleState.enemies.map((e) => buildUnit(e, false));
      battleState.step = 'arena';
      battleState.turnSide = 'ally';
      battleState.turnIndex = 0;
      battleState.selectedTargetIndex = 0;
      battleState.busyTurn = false;
      battleState.winnerSide = null;
      battleState.rewardAmount = 0;
      battleState.rewardClaimed = false;
      battleState.currentBattleId = 'war_' + Date.now();
      battleState.logs = [
        `⚔️ Pertempuran ${battleState.mode.toUpperCase()} BATTLE dimulai!`,
        `👑 ${meUnit.username} menurunkan Hero ${hero.name} (${hero.hp} HP | ${hero.damage} DMG)!`
      ];
      playBeep(820, 0.12);
      scheduleRender();
    };

    function renderBattleArenaHTML(user) {
      const isPlayerTurn = battleState.turnSide === 'ally' && battleState.turnIndex === 0 && !battleState.busyTurn;
      const meUnit = battleState.allyTeam[0];

      if (battleState.enemyTeam[battleState.selectedTargetIndex]?.hp <= 0) {
        const nextAlive = battleState.enemyTeam.findIndex((e) => e.hp > 0);
        if (nextAlive >= 0) battleState.selectedTargetIndex = nextAlive;
      }

      const activeUnit = battleState.turnSide === 'ally'
        ? battleState.allyTeam[battleState.turnIndex]
        : battleState.enemyTeam[battleState.turnIndex];

      return `
        <div class="space-y-3 pb-6 relative">
          ${battleState.fxOverlay ? `
            <div class="fixed inset-0 z-50 pointer-events-none flex items-center justify-center">
              <div class="px-6 py-4 rounded-3xl bg-gradient-to-r from-amber-500/90 via-rose-600/90 to-purple-700/90 border-2 border-amber-300 text-center shadow-2xl animate-dragon-blast">
                <div class="text-4xl mb-1">${battleState.fxOverlay.emoji}</div>
                <div class="font-gaming font-black text-sm text-white tracking-wider">${escapeHTML(battleState.fxOverlay.text)}</div>
              </div>
            </div>
          ` : ''}

          <div class="glass-card rounded-2xl p-2.5 border border-amber-400/40 flex items-center justify-between gap-2">
            <div>
              <div class="font-gaming font-black text-xs text-amber-300">
                🛡️ ARENA ${battleState.mode.toUpperCase()}
              </div>
              <div class="text-[10px] text-cyan-300 font-bold">
                Giliran: <span class="text-white underline">${activeUnit ? escapeHTML(activeUnit.username) : '-'}</span>
                ${Number(String(battleState.mode).split('v')[0]) > 1 ? ` (Urutan ke-${battleState.turnIndex + 1})` : ''}
              </div>
            </div>
            <button onclick="confirmRetreatBattle()" class="px-2.5 py-1.5 rounded-xl bg-rose-950/80 border border-rose-500/50 text-rose-300 font-gaming font-bold text-[10px]">
              🏳️ MUNDUR
            </button>
          </div>

          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-[10px] font-gaming font-bold text-rose-400 px-1">
              <span>🔴 TIM LAWAN (Ketuk kartu untuk kunci target)</span>
              <span>${battleState.enemyTeam.filter((u) => u.hp > 0).length}/${battleState.enemyTeam.length} Hidup</span>
            </div>
            <div class="grid ${battleState.enemyTeam.length > 1 ? 'grid-cols-3' : 'grid-cols-1'} gap-2">
              ${battleState.enemyTeam.map((en, idx) => renderCombatUnitCard(en, idx, 'enemy')).join('')}
            </div>
          </div>

          <div class="flex items-center justify-center gap-2 py-0.5">
            <div class="h-px flex-1 bg-gradient-to-r from-transparent via-rose-500/50 to-amber-400"></div>
            <span class="px-3 py-0.5 rounded-full bg-slate-950 border border-amber-400/60 font-gaming font-black text-[10px] text-amber-300">VS</span>
            <div class="h-px flex-1 bg-gradient-to-l from-transparent via-cyan-500/50 to-amber-400"></div>
          </div>

          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-[10px] font-gaming font-bold text-cyan-300 px-1">
              <span>🔵 TIM KAMU (Serangan Berurutan)</span>
              <span>${battleState.allyTeam.filter((u) => u.hp > 0).length}/${battleState.allyTeam.length} Hidup</span>
            </div>
            <div class="grid ${battleState.allyTeam.length > 1 ? 'grid-cols-3' : 'grid-cols-1'} gap-2">
              ${battleState.allyTeam.map((al, idx) => renderCombatUnitCard(al, idx, 'ally')).join('')}
            </div>
          </div>

          <div class="glass-card rounded-2xl p-3 border ${isPlayerTurn ? 'border-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.25)]' : 'border-slate-800'} space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-gaming font-black text-xs ${isPlayerTurn ? 'text-amber-300' : 'text-slate-400'}">
                ${isPlayerTurn ? '⚡ GILIRAN KAMU MENYERANG!' : '⏳ MENUNGGU GILIRAN TIM / LAWAN...'}
              </span>
              ${meUnit ? `<span class="text-[10px] text-emerald-300 font-bold">💊 Medkit: ${meUnit.medkitsLeft}/3</span>` : ''}
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button ${!isPlayerTurn ? 'disabled' : ''} onclick="playerBattleAction('attack')" class="p-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-orange-500 text-slate-950 font-gaming font-black text-[11px] shadow active:scale-95 disabled:opacity-40 text-left">
                <div>⚔️ SERANG HERO</div>
                <div class="text-[9px] font-sans font-extrabold opacity-90">DMG ~${meUnit ? meUnit.hero.damage : 0}</div>
              </button>

              <button ${(!isPlayerTurn || !meUnit?.pusakaItem || meUnit.pusakaCooldown > 0) ? 'disabled' : ''} onclick="playerBattleAction('pusaka')" class="p-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-gaming font-black text-[11px] shadow active:scale-95 disabled:opacity-40 text-left">
                <div>🐉 ${meUnit?.pusakaItem ? escapeHTML(meUnit.pusakaItem.name.slice(0, 14)) : 'PUSAKA SAKTI'}</div>
                <div class="text-[9px] font-sans font-extrabold opacity-90">
                  ${!meUnit?.pusakaItem ? 'Tidak dibawa' : meUnit.pusakaCooldown > 0 ? `Cooldown ${meUnit.pusakaCooldown} Giliran` : `Jurus DMG ~${meUnit.pusakaItem.damage}`}
                </div>
              </button>

              <button ${!isPlayerTurn ? 'disabled' : ''} onclick="playerBattleAction('shield')" class="p-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-sky-500 text-slate-950 font-gaming font-black text-[11px] shadow active:scale-95 disabled:opacity-40 text-left">
                <div>🔰 PERISAI</div>
                <div class="text-[9px] font-sans font-extrabold opacity-90">+${meUnit ? Math.round(meUnit.maxShield * 0.65) : 400} Shield</div>
              </button>

              <button ${(!isPlayerTurn || !meUnit || meUnit.medkitsLeft <= 0) ? 'disabled' : ''} onclick="playerBattleAction('medkit')" class="p-2.5 rounded-xl bg-gradient-to-r from-emerald-400 to-green-500 text-slate-950 font-gaming font-black text-[11px] shadow active:scale-95 disabled:opacity-40 text-left">
                <div>💊 PAKAI MEDKIT</div>
                <div class="text-[9px] font-sans font-extrabold opacity-90">Heal +${meUnit ? meUnit.medkitHeal : 750} HP (${meUnit ? meUnit.medkitsLeft : 0})</div>
              </button>
            </div>
          </div>

          <div class="glass-card rounded-2xl p-2.5 border border-slate-800 space-y-1 max-h-28 overflow-y-auto">
            <div class="text-[9px] font-gaming font-bold text-slate-400">📜 LOG ARENA PEPERANGAN</div>
            ${battleState.logs.slice(0, 6).map((l) => `
              <div class="text-[11px] text-slate-200 leading-snug border-b border-slate-800/60 pb-1">${escapeHTML(l)}</div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCombatUnitCard(unit, idx, side) {
      const isDead = unit.hp <= 0;
      const isCurrentTurn = battleState.turnSide === side && battleState.turnIndex === idx && !isDead;
      const isTargetedEnemy = side === 'enemy' && battleState.selectedTargetIndex === idx && !isDead;
      const isHit = battleState.hitTargetId === unit.uid;
      const hpPct = Math.max(0, Math.min(100, Math.round((unit.hp / unit.maxHp) * 100)));
      const shieldPct = unit.maxShield > 0 ? Math.max(0, Math.min(100, Math.round((unit.shield / unit.maxShield) * 100))) : 0;

      return `
        <div onclick="${side === 'enemy' && !isDead ? `selectEnemyBattleTarget(${idx})` : ''}"
             class="relative rounded-2xl p-2 bg-slate-950/95 border-2 transition-all ${isDead ? 'opacity-40 grayscale border-slate-800' : isCurrentTurn ? 'border-amber-400 ring-2 ring-amber-400/50 scale-[1.02]' : isTargetedEnemy ? 'border-rose-500 shadow-[0_0_14px_rgba(244,63,94,0.45)]' : 'border-slate-800'} ${isHit ? 'animate-hit-shake' : ''} ${side === 'enemy' && !isDead ? 'cursor-pointer' : ''}">

          ${battleState.floatDmg && battleState.floatDmg.unitId === unit.uid ? `
            <div class="absolute top-1/3 left-1/2 z-30 font-gaming font-black text-sm ${battleState.floatDmg.color} drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)] animate-float-dmg whitespace-nowrap pointer-events-none">
              ${escapeHTML(battleState.floatDmg.text)}
            </div>
          ` : ''}

          ${isTargetedEnemy ? `<span class="absolute -top-2 right-1.5 px-1.5 py-0.2 rounded bg-rose-600 text-white font-gaming font-black text-[8px]">🎯 TARGET</span>` : ''}
          ${isCurrentTurn ? `<span class="absolute -top-2 left-1.5 px-1.5 py-0.2 rounded bg-amber-400 text-slate-950 font-gaming font-black text-[8px]">⚡ GILIRAN</span>` : ''}

          <div class="flex items-center gap-1.5">
            <img src="${unit.hero.image}" class="w-9 h-9 rounded-xl object-cover border border-amber-400/50 shrink-0 bg-slate-900" />
            <div class="min-w-0 flex-1">
              <div class="text-[10px] font-bold text-white truncate">${escapeHTML(unit.username)}</div>
              <div class="text-[8px] text-amber-300 truncate">${escapeHTML(unit.hero.name)}</div>
            </div>
          </div>

          <div class="mt-1.5 space-y-1">
            <div class="flex justify-between text-[8px] font-bold">
              <span class="text-rose-400">❤️ HP</span>
              <span class="text-white">${isDead ? 'GUGUR' : `${unit.hp}/${unit.maxHp}`}</span>
            </div>
            <div class="w-full h-1.5 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full bg-gradient-to-r from-rose-500 to-emerald-400 transition-all duration-300" style="width:${hpPct}%"></div>
            </div>

            <div class="flex justify-between text-[8px] font-bold">
              <span class="text-cyan-300">🔰 Shield</span>
              <span class="text-cyan-200">${unit.shield}</span>
            </div>
            <div class="w-full h-1 rounded-full bg-slate-800 overflow-hidden">
              <div class="h-full bg-cyan-400 transition-all duration-300" style="width:${shieldPct}%"></div>
            </div>
          </div>

          <div class="mt-1.5 pt-1 border-t border-slate-800/80 flex items-center justify-between gap-1 text-[9px]">
            <span title="Perisai: ${escapeHTML(unit.shieldItem?.name || '-')}">🔰</span>
            <span title="Pusaka: ${escapeHTML(unit.pusakaItem?.name || '-')}" class="${unit.pusakaItem ? 'opacity-100' : 'opacity-30'}">🐉</span>
            <span class="text-emerald-300 font-bold">💊×${unit.medkitsLeft}</span>
          </div>
        </div>
      `;
    }

    window.selectEnemyBattleTarget = function(idx) {
      if (battleState.enemyTeam[idx] && battleState.enemyTeam[idx].hp > 0) {
        battleState.selectedTargetIndex = idx;
        scheduleRender();
      }
    };

    window.confirmRetreatBattle = function() {
      battleState.step = 'setup';
      battleState.busyTurn = false;
      scheduleRender();
    };

    function applyDamageToUnit(attacker, target, rawDamage, isPusaka = false) {
      const variance = 0.92 + Math.random() * 0.18;
      let dmg = Math.round(rawDamage * variance);
      let absorbed = 0;

      if (target.shield > 0) {
        absorbed = Math.min(target.shield, dmg);
        target.shield -= absorbed;
        dmg -= absorbed;
      }
      target.hp = Math.max(0, target.hp - dmg);
      attacker.totalDamageDealt += (dmg + absorbed);

      battleState.hitTargetId = target.uid;
      battleState.floatDmg = {
        unitId: target.uid,
        text: isPusaka ? `🔥 -${dmg + absorbed} NAGA!` : `-${dmg + absorbed}`,
        color: isPusaka ? 'text-amber-300' : 'text-rose-400'
      };
      setTimeout(() => {
        battleState.hitTargetId = null;
        battleState.floatDmg = null;
        scheduleRender();
      }, 950);

      return { hpDamage: dmg, shieldAbsorbed: absorbed };
    }

    window.playerBattleAction = function(actionType) {
      if (battleState.turnSide !== 'ally' || battleState.turnIndex !== 0 || battleState.busyTurn) return;
      const meUnit = battleState.allyTeam[0];
      if (!meUnit || meUnit.hp <= 0) return;

      battleState.busyTurn = true;
      if (meUnit.pusakaCooldown > 0) meUnit.pusakaCooldown--;

      const target = battleState.enemyTeam[battleState.selectedTargetIndex] || battleState.enemyTeam.find((e) => e.hp > 0);

      if (actionType === 'attack' && target) {
        const res = applyDamageToUnit(meUnit, target, meUnit.hero.damage, false);
        battleState.fxOverlay = { emoji: '⚔️', text: `TEBASAN ${meUnit.hero.name.toUpperCase()}!` };
        battleState.logs.unshift(`⚔️ ${meUnit.username} menyerang ${target.username} (-${res.hpDamage + res.shieldAbsorbed} DMG)!`);
        playBeep(660, 0.09);
      } else if (actionType === 'pusaka' && meUnit.pusakaItem && target) {
        meUnit.pusakaCooldown = 2;
        const res = applyDamageToUnit(meUnit, target, meUnit.pusakaItem.damage, true);
        battleState.fxOverlay = { emoji: '🐉🔥', text: `JURUS ${meUnit.pusakaItem.name.toUpperCase()}!` };
        battleState.logs.unshift(`🐉 ${meUnit.username} melepaskan ${meUnit.pusakaItem.name} ke ${target.username} (-${res.hpDamage + res.shieldAbsorbed} DMG)!`);
        playBeep(880, 0.14);
      } else if (actionType === 'shield') {
        const addSh = Math.round(meUnit.maxShield * 0.65);
        meUnit.shield = Math.min(meUnit.maxShield, meUnit.shield + addSh);
        battleState.fxOverlay = { emoji: '🔰', text: `PERISAI AKTIF (+${addSh} SHIELD)` };
        battleState.floatDmg = { unitId: meUnit.uid, text: `+${addSh} SHIELD`, color: 'text-cyan-300' };
        battleState.logs.unshift(`🔰 ${meUnit.username} mengaktifkan ${meUnit.shieldItem.name} (+${addSh} Shield)!`);
        playBeep(540, 0.09);
      } else if (actionType === 'medkit' && meUnit.medkitsLeft > 0) {
        meUnit.medkitsLeft -= 1;
        const healAmt = meUnit.medkitHeal;
        meUnit.hp = Math.min(meUnit.maxHp, meUnit.hp + healAmt);
        battleState.fxOverlay = { emoji: '💊💚', text: `MEDKIT HEAL (+${healAmt} HP)` };
        battleState.floatDmg = { unitId: meUnit.uid, text: `+${healAmt} HP`, color: 'text-emerald-400' };
        battleState.logs.unshift(`💊 ${meUnit.username} memakai Medkit (+${healAmt} HP)!`);
        playBeep(760, 0.09);
      }

      setTimeout(() => {
        battleState.fxOverlay = null;
        scheduleRender();
      }, 800);

      scheduleRender();
      setTimeout(() => advanceBattleTurn(), 1050);
    };

    function advanceBattleTurn() {
      const allyAlive = battleState.allyTeam.some((u) => u.hp > 0);
      const enemyAlive = battleState.enemyTeam.some((u) => u.hp > 0);

      if (!enemyAlive) {
        finishBattleMatch('ally');
        return;
      }
      if (!allyAlive) {
        finishBattleMatch('enemy');
        return;
      }

      if (battleState.turnSide === 'ally') {
        let nextAlly = battleState.turnIndex + 1;
        while (nextAlly < battleState.allyTeam.length && battleState.allyTeam[nextAlly].hp <= 0) {
          nextAlly++;
        }
        if (nextAlly < battleState.allyTeam.length) {
          battleState.turnIndex = nextAlly;
          battleState.busyTurn = true;
          scheduleRender();
          setTimeout(() => runAiUnitTurn('ally', nextAlly), 950);
          return;
        } else {
          battleState.turnSide = 'enemy';
          const firstEnemy = battleState.enemyTeam.findIndex((u) => u.hp > 0);
          battleState.turnIndex = firstEnemy >= 0 ? firstEnemy : 0;
          battleState.busyTurn = true;
          scheduleRender();
          setTimeout(() => runAiUnitTurn('enemy', battleState.turnIndex), 950);
          return;
        }
      } else {
        let nextEnemy = battleState.turnIndex + 1;
        while (nextEnemy < battleState.enemyTeam.length && battleState.enemyTeam[nextEnemy].hp <= 0) {
          nextEnemy++;
        }
        if (nextEnemy < battleState.enemyTeam.length) {
          battleState.turnIndex = nextEnemy;
          battleState.busyTurn = true;
          scheduleRender();
          setTimeout(() => runAiUnitTurn('enemy', nextEnemy), 950);
          return;
        } else {
          battleState.turnSide = 'ally';
          const firstAlly = battleState.allyTeam.findIndex((u) => u.hp > 0);
          battleState.turnIndex = firstAlly >= 0 ? firstAlly : 0;
          battleState.busyTurn = battleState.turnIndex !== 0;
          scheduleRender();
          if (battleState.turnIndex !== 0) {
            setTimeout(() => runAiUnitTurn('ally', battleState.turnIndex), 950);
          }
        }
      }
    }

    function runAiUnitTurn(side, idx) {
      const ownTeam = side === 'ally' ? battleState.allyTeam : battleState.enemyTeam;
      const oppTeam = side === 'ally' ? battleState.enemyTeam : battleState.allyTeam;
      const actor = ownTeam[idx];
      if (!actor || actor.hp <= 0) {
        advanceBattleTurn();
        return;
      }

      if (actor.pusakaCooldown > 0) actor.pusakaCooldown--;

      if (actor.hp < actor.maxHp * 0.38 && actor.medkitsLeft > 0) {
        actor.medkitsLeft--;
        actor.hp = Math.min(actor.maxHp, actor.hp + actor.medkitHeal);
        battleState.floatDmg = { unitId: actor.uid, text: `+${actor.medkitHeal} HP`, color: 'text-emerald-400' };
        battleState.logs.unshift(`💊 ${actor.username} menggunakan Medkit (+${actor.medkitHeal} HP)!`);
      } else {
        const aliveTargets = oppTeam.filter((u) => u.hp > 0);
        if (aliveTargets.length === 0) {
          advanceBattleTurn();
          return;
        }
        aliveTargets.sort((a, b) => a.hp - b.hp);
        const target = aliveTargets[0];

        if (actor.pusakaItem && actor.pusakaCooldown === 0 && Math.random() < 0.45) {
          actor.pusakaCooldown = 2;
          const res = applyDamageToUnit(actor, target, actor.pusakaItem.damage, true);
          battleState.fxOverlay = { emoji: '🐉', text: `${actor.username}: ${actor.pusakaItem.name}!` };
          battleState.logs.unshift(`🐉 ${actor.username} memicu ${actor.pusakaItem.name} ke ${target.username} (-${res.hpDamage + res.shieldAbsorbed} DMG)!`);
        } else {
          const res = applyDamageToUnit(actor, target, actor.hero.damage, false);
          battleState.logs.unshift(`⚔️ ${actor.username} menyerang ${target.username} (-${res.hpDamage + res.shieldAbsorbed} DMG)!`);
        }
      }

      playBeep(side === 'ally' ? 620 : 380, 0.08);
      setTimeout(() => {
        battleState.fxOverlay = null;
        scheduleRender();
      }, 750);

      scheduleRender();
      setTimeout(() => advanceBattleTurn(), 1000);
    }

    async function finishBattleMatch(winnerSide) {
      const user = getCurrentUser();
      battleState.step = 'result';
      battleState.winnerSide = winnerSide;
      battleState.busyTurn = false;

      const isWin = winnerSide === 'ally';
      const teamSize = Math.max(1, Number(String(battleState.mode).split('v')[0]) || 1);
      const reward = isWin ? (teamSize === 1 ? 400 : 400 * teamSize) : 0;
      battleState.rewardAmount = reward;
      battleState.rewardClaimed = false;

      if (user) {
        const meUnit = battleState.allyTeam[0];
        if (isWin) {
          user.level = Number(user.level || 1) + 1;

          if (Number(String(battleState.mode).split('v')[0]) > 1) {
            for (const ally of battleState.allies) {
              if (ally.isFriend && ally.email && state.users[ally.email]) {
                const friendAcc = state.users[ally.email];
                friendAcc.diamond = Number(friendAcc.diamond || 0) + 1000;
                friendAcc.messages = friendAcc.messages || [];
                friendAcc.messages.unshift({
                  id: 'team_win_' + Date.now() + '_' + friendAcc.id,
                  title: '🏆 KEMENANGAN TEAM BATTLE (+1.000 💎)',
                  body: `Selamat! Tim kamu bersama ${user.username} menang Team Battle! Kamu mendapat +1.000 Diamond!`,
                  from: 'ARENA PEPERANGAN',
                  time: new Date().toLocaleString('id-ID'),
                  read: false
                });
                await saveUser(friendAcc);
              }
            }
          }
        }

        user.battleHistory = user.battleHistory || [];
        user.battleHistory.unshift({
          id: battleState.currentBattleId || ('war_' + Date.now()),
          mode: `TEAM BATTLE ${battleState.mode.toUpperCase()}`, 
          result: isWin ? 'WIN' : 'LOSE',
          heroName: meUnit?.hero?.name || 'Hero',
          heroImage: meUnit?.hero?.image || '',
          damageDealt: meUnit?.totalDamageDealt || 0,
          allyNames: battleState.allyTeam.map((u) => u.username),
          enemyNames: battleState.enemyTeam.map((u) => u.username),
          reward,
          claimed: !isWin,
          time: new Date().toLocaleString('id-ID')
        });

        await saveUser(user);
        playBeep(isWin ? 920 : 220, 0.22);
      }

      scheduleRender();
    }

    window.selectSpinMachine = function(idx) {

    window.executeSpin = async function(count) {
      if (isSpinning) return;
      const user = getCurrentUser();
      const machine = (state.config.spinMachines || [])[activeMachineIdx];
      if (!user || !machine || !machine.items || machine.items.length === 0) return;

      const prices = getMachinePrices(machine);
      const cost = Number(prices[count] || count * 200);
      if (user.diamond < cost) {
        return showToast(`Diamond tidak cukup! Butuh ${cost} Diamond.`, 'error');
      }

      isSpinning = true;
      user.diamond -= cost;
      user.stats = user.stats || {};
      user.stats.spinCount = (user.stats.spinCount || 0) + count;
      await saveUser(user);
      renderApp();

      function pickWeightedItem() {
        const items = machine.items;
        const validItems = items.map((x, idx) => ({ item: x, index: idx, weight: Math.max(0, Number(x.chance ?? 10)) }));
        const totalW = validItems.reduce((s, x) => s + x.weight, 0);
        if (totalW <= 0) return { item: items[0], index: 0 };
        let r = Math.random() * totalW;
        for (let i = 0; i < validItems.length; i++) {
          r -= validItems[i].weight;
          if (r <= 0) return { item: validItems[i].item, index: validItems[i].index };
        }
        return { item: validItems[0].item, index: validItems[0].index };
      }

      const rewards = [];
      let lastIdx = 0;
      for (let i = 0; i < count; i++) {
        const picked = pickWeightedItem();
        rewards.push(picked.item);
        lastIdx = picked.index;
      }

      const totalBoxes = machine.items.length;
      const steps = 14 + lastIdx;
      let step = 0;
      const timer = setInterval(async () => {
        document.querySelectorAll('[id^="ffBox_"]').forEach((el) => el.classList.remove('ff-box-active'));
        const curBox = document.getElementById(`ffBox_${step % totalBoxes}`);
        if (curBox) curBox.classList.add('ff-box-active');
        playBeep(440 + (step % totalBoxes) * 55, 0.04);
        step++;

        if (step > steps) {
          clearInterval(timer);
          isSpinning = false;

          let totalWonDiamond = 0;
          let wonItemCount = 0;
          let zonkCount = 0;

          rewards.forEach((rw, idx) => {
            const rType = rw.rewardType || (rw.category === 'ZONK' ? 'ZONK' : rw.category === 'DIAMOND' ? 'DIAMOND' : 'ITEM');
            if (rType === 'ZONK') {
              zonkCount++;
            } else if (rType === 'DIAMOND') {
              const dmAmt = Math.max(0, Number(rw.diamondAmount || 0));
              totalWonDiamond += dmAmt;
              user.diamond += dmAmt;
            } else {
              wonItemCount++;
              user.inventory.push({
                uid: 'inv_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).slice(2, 6),
                name: rw.name,
                category: rw.category || 'HERO',
                rarity: rw.rarity || 'RARE',
                hp: rw.hp || 2500,
                damage: rw.damage || 450,
                desc: rw.desc,
                image: rw.image
              });
            }
          });

          user.level = (user.level || 1) + 1;
          await saveUser(user);
          playBeep(zonkCount === rewards.length ? 220 : 880, 0.15);
          renderApp();

          const allZonk = zonkCount === rewards.length;
          openModal(`
            <div class="space-y-3 text-center">
              <h3 class="font-gaming font-black text-base ${allZonk ? 'text-rose-400' : 'text-amber-400'}">
                ${allZonk ? '💀 YAH ZONK! COBA LAGI!' : `🎉 HASIL LUKY ROYALE (${count}×)`}
              </h3>
              <div class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto">
                ${rewards.map((rw) => {
                  const rType = rw.rewardType || (rw.category === 'ZONK' ? 'ZONK' : rw.category === 'DIAMOND' ? 'DIAMOND' : 'ITEM');
                  return `
                    <div class="p-2.5 rounded-xl bg-slate-950 border ${rType === 'ZONK' ? 'border-slate-700 opacity-85' : 'border-amber-400/50'}">
                      <img src="${rw.image}" class="w-12 h-12 mx-auto rounded-lg object-cover" />
                      <div class="font-bold text-xs text-white mt-1 truncate">${escapeHTML(rw.name)}</div>
                      ${rType === 'ZONK'
                        ? `<div class="text-[10px] text-rose-400 font-gaming font-bold">ZONK (ZONK!)</div>`
                        : rType === 'DIAMOND'
                          ? `<div class="text-[10px] text-cyan-300 font-bold">💎 +${Number(rw.diamondAmount || 0).toLocaleString('id-ID')} DIAMOND</div>`
                          : `<div class="text-[9px] text-amber-300 font-bold">${rw.category} • ❤️ ${rw.hp || 0} | ⚔️ ${rw.damage || 0}</div>`}
                    </div>
                  `;
                }).join('')}
              </div>
              <p class="text-[11px] text-emerald-300 font-semibold">
                ${wonItemCount > 0 ? `${wonItemCount} Koleksi masuk Penyimpanan • ` : ''}
                ${totalWonDiamond > 0 ? `+${totalWonDiamond.toLocaleString('id-ID')} Diamond ditambahkan • ` : ''}
                ${zonkCount > 0 ? `${zonkCount}× Zonk` : ''}
              </p>
              <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-amber-400 text-slate-950 font-gaming font-black text-xs">MANTAP!</button>
            </div>
          `);
        }
      }, 85);
    };

    window.claimMilestoneMission = async function(type, id, dm) {
      const user = getCurrentUser();
      if (!user) return;
      const key = type === 'topup' ? 'claimedTopup' : 'claimedSpin';
      user.stats[key] = user.stats[key] || [];
      if (user.stats[key].includes(id)) return showToast('Hadiah misi ini sudah diklaim.','error');
      const targets = type === 'topup' ? {tu_2:2,tu_4:4,tu_6:6,tu_8:8,tu_10:10} : {sp_5:5,sp_7:7,sp_10:10};
      const progress = Number(type === 'topup' ? user.stats.topupCount || 0 : user.stats.spinCount || 0);
      if (progress < (targets[id] || Infinity)) return showToast('Progres misi belum mencukupi.','error');
      user.stats[key].push(id);
      user.diamond = Number(user.diamond || 0) + Number(dm || 0);
      await saveUser(user);
      showToast(`Misi selesai! +${dm} Diamond ditambahkan!`, 'success');
